<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hale admin</title>
<style>
  :root { --bg: #fff; --fg: #1a1a1a; --muted: #666; --line: #ddd; --accent: #2a5db0; --panel: #f6f7f9; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14161a; --fg: #e8e8e8; --muted: #9a9a9a; --line: #333; --accent: #7aa7ff; --panel: #1d2026; } }
  body { margin: 0; padding: 16px; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); max-width: 960px; margin-inline: auto; }
  h1 { font-size: 20px; margin: 0 0 4px; } h2 { font-size: 16px; margin: 24px 0 8px; }
  .note { color: var(--muted); font-size: 13px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 8px 0; background: var(--panel); }
  .card b { font-family: ui-monospace, monospace; }
  textarea, pre { width: 100%; box-sizing: border-box; font: 13px ui-monospace, monospace; }
  textarea { min-height: 72px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 6px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; white-space: pre-wrap; max-height: 320px; overflow: auto; }
  button { font: inherit; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; margin-top: 6px; }
  button.quiet { background: transparent; color: var(--accent); }
</style>
</head>
<body>
<h1>hale admin</h1>
<div class="note" id="head">loading the description…</div>
<h2>Members</h2><div id="members"></div>
<h2>Streams</h2><div id="streams"></div>
<script>
const ENDPOINT = {{ENDPOINT}};
const TOKEN = "{{TOKEN}}";
const headers = (extra = {}) => Object.assign({ "X-Hale-Admin": TOKEN }, extra);
const $ = (s) => document.querySelector(s);
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); Object.assign(e, a); kids.forEach(k => e.append(k)); return e; };
const show = (pre, v) => { pre.textContent = typeof v === "string" ? v : JSON.stringify(v, null, 2); };
async function main() {
  // The exposure describes what this caller's roles show: a member or a
  // stream listed is one the next call or subscription admits.
  const d = await (await fetch("/api/describe", { headers: headers() })).json();
  if (d.error) { $("#head").textContent = d.error; return; }
  const who = d.caller && d.caller.principal ? d.caller.principal.name : "nobody";
  const roles = d.caller && d.caller.roles.length ? d.caller.roles.join(", ") : "no role";
  $("#head").textContent = `${d.exposure} over ${ENDPOINT}, as ${who} (${roles}). ` + Object.values(d.notes || {}).join(" ");
  const resolve = (s) => (s && s.$ref ? (d.schemas || {})[s.$ref.split("/").pop()] : s) || {};
  const sample = (s) => { s = resolve(s); if (s.type === "integer" || s.type === "number") return 0; if (s.type === "boolean") return false; if (s.type === "string") return ""; const o = {}; for (const [k, p] of Object.entries(s.properties || {})) o[k] = sample(p); return o; };
  for (const m of d.members || []) {
    const ta = el("textarea", { value: JSON.stringify(sample(m.request), null, 1) });
    const out = el("pre");
    const btn = el("button", { textContent: "call" });
    btn.onclick = async () => { try { const r = await fetch("/api/call/" + encodeURIComponent(m.name), { method: "POST", headers: headers({ "Content-Type": "application/json" }), body: ta.value }); show(out, await r.json()); } catch (e) { show(out, String(e)); } };
    const c = el("div", { className: "card" });
    c.append(el("div", {}, el("b", { textContent: m.name }), m.requires.length ? `, requires ${m.requires.join(", ")}` : ""), ta, btn, out);
    $("#members").append(c);
  }
  for (const s of d.streams || []) {
    const out = el("pre");
    let es = null;
    const btn = el("button", { textContent: "watch" });
    const stop = el("button", { textContent: "stop", className: "quiet" });
    btn.onclick = () => { if (es) es.close(); out.textContent = ""; es = new EventSource("/api/watch/" + encodeURIComponent(s.topic) + "?token=" + TOKEN); es.onmessage = (m) => { out.textContent += m.data + "\n"; out.scrollTop = out.scrollHeight; }; es.onerror = () => { out.textContent += "(closed)\n"; es.close(); }; };
    stop.onclick = () => { if (es) es.close(); };
    const c = el("div", { className: "card" });
    c.append(el("div", {}, el("b", { textContent: s.topic }), s.requires.length ? `, requires ${s.requires.join(", ")}` : ""), btn, stop, out);
    $("#streams").append(c);
  }
}
main();
</script>
</body>
</html>
