syntax = "proto3";

service Orders {
  // Cancel an order.
  //
  // rpc Desk::cancel
  // requires no role
  rpc Desk__cancel(Ticket) returns (Ticket);

  // rpc Desk::count
  // requires no role
  rpc Desk__count(Ticket) returns (Desk__countResponse);

  // Place an order.
  // It is filled at the limit or better; a desk that is closed refuses it.
  //
  // rpc Desk::place
  // requires clerk
  // handler error: status 9, a detail of type type.hale.dev/OrderError
  rpc Desk__place(PlaceOrder) returns (Receipt);
}

// A request to place an order.
//
// The desk fills it at the limit or better.
message PlaceOrder {
  // The instrument's ticker symbol.
  optional string symbol = 1;
  // How many units to buy.
  optional int64 qty = 2;
  // An amount of money, counted in cents.
  optional int64 limit = 3; // Hale: Money, q(cent)
  // Where the order came from.
  optional Origin origin = 4;
}

// What the desk did with an order.
message Receipt {
  // The order's number on the desk.
  optional int64 order = 1;
  // An amount of money, counted in cents.
  optional int64 notional = 2; // Hale: Money, q(cent)
}

message Ticket {
  optional int64 order = 1;
}

// Why an order was not placed.
message OrderError {
  oneof value {
    // No instrument has the symbol.
    bool UnknownSymbol = 1;
    // The desk is closed for the day.
    bool Closed = 2;
    string Rejected = 3;
  }
}

// The response of `Desk::count`, a scalar.
message Desk__countResponse {
  optional int64 value = 1;
}

// A refusal, and the server error (kind "server"): the detail of its status.
// `requires` is the roles of an unauthorized refusal, `served` the digest of a digest_mismatch one.
message HaleRefusal {
  string kind = 1;
  string reason = 2;
  repeated string requires = 3;
  string served = 4;
}

// Where an order came from.
enum Origin {
  // Typed by a person.
  Origin_Desk = 0;
  Origin_Api = 1;
}
