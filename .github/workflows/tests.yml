name: tests

# Runs the full workspace test suite on every pull request targeting
# main and on every push to main. Linux-only at v1; the macos
# workflow and the release workflow cover macOS.
#
# Uses cargo-nextest (drop-in replacement for `cargo test`) for
# smarter scheduling: each test runs in its own process.
# Workspace-wide test time drops ~2-3x vs libtest.
#
# NB: an earlier version of this comment claimed process-per-test
# was what made the shared `/tmp/lotus_test_*` paths safe. That was
# wrong — process isolation is not filesystem isolation, and two
# processes writing one path are MORE concurrent than two threads,
# not less. The suite passed because the `name` arguments happened
# not to overlap; nothing enforced it. Uniqueness now comes from
# `harness::unique_bin` (pid + counter), enforced by
# `harness_paths_are_unique.rs`.
#
# Build-and-run-per-partition shape: N parallel `test` jobs each
# build the workspace from the shared cargo cache and run a
# hash-partitioned subset (`cargo nextest run --partition`). There
# is deliberately NO separate compile-once `build` job + archive
# handoff: that serialized the run behind a full compile *and* an
# archive upload/download round-trip (~1.7min upload alone), and
# each partition still paid its own ~2min setup afterward. Folding
# the build into each partition overlaps the compile with the
# (already parallel) partitions and drops the round-trip — ~3-4min
# of wall-clock — at the cost of compiling ~Nx instead of once (the
# cargo cache keeps each warm build to ~3min). Wall-clock over CI
# minutes, for branch-iteration velocity.
#
# Revisited 2026-09-20 with libLLVM linked dynamically: a warm
# partition now spends ~4min building (workspace + its 560 test
# binaries) and the nextest archive of the suite is 1.1GB. A build
# job on a standard 4-core runner would take about as long as each
# partition's own build, so the split still buys nothing unless
# that one job moves to a larger (paid) runner. Six partitions
# instead of four: CI minutes are free on a public repository, and
# each partition's test phase is what shrinks.

# One run per commit. A push to a PR branch used to trigger this
# twice — once as `push` (every branch) and once as `pull_request`
# — in two concurrency groups, so neither cancelled the other:
# 140 of 140 pull_request runs over 2026-09-18..20 had a twin push
# run on the same SHA. Push runs are for main only now; a branch
# gets its run through its PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight run on the same branch when a new push lands;
# tests on the older commit are already stale.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
  # sccache in front of rustc, backed by the Actions cache. rust-cache
  # (below) keeps dependency artifacts, but the workspace crates and
  # all ~565 test crates recompile on every commit — 2.6-4.2min of
  # each partition on 2026-09-20 — even when the commit touched no
  # Rust at all. sccache keys each rustc invocation on its inputs, so
  # a .hl-only or docs-only change compiles almost nothing, and a
  # compiler change recompiles only the crates downstream of it.
  # Linking is not cached; that is what the dynamic libLLVM is for.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  # Which jobs this diff can possibly affect.
  #
  # NOT a markdown filter. Prose is genuinely tested here: every
  # ```hale block under `docs/src` must parse (`docs_snippets`), every
  # snippet in `spec/styleguide.md` must compile
  # (`styleguide_snippets`), and `hale-cli/build.rs` embeds `spec/*.md`
  # into the binary for `hale mcp`. A docs change is a code change to
  # those, and the partitions below always run.
  #
  # What prose cannot reach is the SUBSTRATE: the C runtime the
  # sanitizers exercise and the hand-transcribed models GenMC checks.
  # No sentence in a `.md` alters a memory ordering. Those three jobs
  # are ~20 CI-minutes that a prose-only change spends on nothing.
  #
  # Fails SAFE: anything it cannot classify — a new-branch push with no
  # `before` sha, a diff it cannot compute — runs everything.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      substrate: ${{ steps.classify.outputs.substrate }}
      # The same verdict under the name the test partitions read it
      # by: a prose-only diff runs `quick` and `docs` (below) and
      # skips the six partitions. Prose IS tested — every ```hale
      # block under docs/src must parse, every styleguide snippet
      # must typecheck, `hale mcp` serves the embedded spec — but
      # those tests live in hale-syntax, hale-types and one hale-cli
      # binary, and `quick` + `docs` run exactly those.
      code: ${{ steps.classify.outputs.substrate }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          # The first push of a NEW branch has no `before` sha — it is all
          # zeros — so the classifier had nothing to diff against and every
          # new branch paid the full substrate suite on its first push, even
          # for one line of prose. That is not genuinely unclassifiable: the
          # branch's diff against the default branch is exactly what its own
          # pull_request run computes a moment later, and the two disagreeing
          # is how this was noticed (one run skipped the three jobs, the
          # other ran them, same commit).
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            default="origin/${{ github.event.repository.default_branch }}"
            base="$(git merge-base "$default" HEAD 2>/dev/null || true)"
            [ -n "$base" ] && echo "no before-sha; using merge-base with $default: $base"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base — running everything"
            echo "substrate=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base"...HEAD)
          echo "changed files:"; echo "$changed"
          # Paths that cannot reach the runtime, the models, or codegen.
          prose='^(README|AGENTS|CHANGELOG|CONTRIBUTING|LICENSE|SECURITY)|^(docs|spec|notes|agents)/|\.md$'
          # Counted, not `grep -q`: an empty match makes grep exit 1,
          # so the exit code alone cannot distinguish "no code files"
          # from "grep failed" — and getting that backwards would skip
          # the substrate jobs on a runtime change.
          code=$(printf '%s\n' "$changed" | grep -cvE "$prose" || true)
          echo "non-prose files: ${code:-unknown}"
          if [ "${code:-1}" -gt 0 ]; then
            echo "substrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "prose-only diff — skipping sanitizer + model-checker jobs"
            echo "substrate=false" >> "$GITHUB_OUTPUT"
          fi

  # The fast lane: everything that needs no LLVM, in about two
  # minutes. hale-syntax, hale-types, hale-model, hale-stdlib and
  # hale-corpus have no dependency on inkwell, so this job skips the
  # LLVM install and the codegen build entirely and reports a parse,
  # typecheck, model or corpus-baseline failure long before a
  # partition has finished compiling. It runs on every diff; the
  # partitions below run the same tests again as part of the whole.
  quick:
    name: quick (parse, typecheck, model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quick-x86_64-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest run (LLVM-free crates)
        run: |
          cargo nextest run --release \
            -p hale-syntax -p hale-types -p hale-model \
            -p hale-stdlib -p hale-corpus

  # A prose-only diff's only remaining exposure after `quick`: the
  # `hale mcp` docs-search serves spec/*.md embedded at build time
  # (hale-cli/build.rs), and its test asserts on that text. One
  # binary, so one job, instead of six partitions.
  docs:
    name: docs (embedded spec)
    needs: scope
    if: needs.scope.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: false

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest run (hale mcp over the embedded spec)
        run: |
          cargo nextest run --release \
            -p hale-cli --test mcp \
            --features hale-codegen/dynamic-llvm

  # The partitions are by BINARY SET, not by test-name hash. Every
  # file under a crate's tests/ is its own test binary — 565 across
  # the workspace — and a hash partition over test names needs nearly
  # all of them, so each of six partitions spent ~4min compiling and
  # linking the whole set to run a sixth of it (2026-09-20, and
  # sccache cannot help: it caches rlibs, never bin/test crate
  # types). Three job families instead, each building only what it
  # runs: `cli` (hale-cli and the crates beside it, minus the DNA
  # fixture suite), `codegen` (hale-codegen's 334 binaries, split by
  # FILE so each half compiles 167), and `dna` (the fixture suite on
  # its own, so its slices can run four-wide). The LLVM-free crates
  # are `quick`'s.
  cli:
    name: cli ${{ matrix.part }}/3
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Don't short-circuit other partitions on first failure —
      # we want to see the full failure picture across the suite.
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    # GH #583 K1: the knowledge store's Postgres half runs against a
    # service container; `dna/tests/knowledge_store_test.hl` reads the
    # DSN and skips the half when it is unset (a laptop without one).
    services:
      knowledge-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dna
          POSTGRES_PASSWORD: dna
          POSTGRES_DB: dna
        ports:
          - 5480:5432
        options: >-
          --health-cmd "pg_isready -U dna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HALE_DNA_KNOWLEDGE_DSN: postgres://dna:dna@127.0.0.1:5480/dna?sslmode=disable
      # The DNA tests push to bare remotes under /tmp and clone from them
      # moments later. git's automatic gc after a receive detaches and
      # can prune a loose object while the clone is still copying it
      # ("failed to copy file to ... objects/..: No such file or
      # directory", a flake on #671). No test repo needs gc.
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: "0"
      GIT_CONFIG_KEY_1: receive.autogc
      GIT_CONFIG_VALUE_1: "false"
    steps:
      - uses: actions/checkout@v4

      # Fixtures resolve via CARGO_MANIFEST_DIR against this checkout,
      # so build + run happen in-place with no path remap.
      #
      # No "Free disk space" step here any more: the test binaries
      # link libLLVM dynamically (`hale-codegen/dynamic-llvm`, below),
      # so the target dir is a few GB rather than tens, and the
      # 1.5-3min of deleting preinstalled toolchains bought nothing.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Shared cache across the partitions (and reused run-to-run).
      # rust-cache keeps only the dependency artifacts — the workspace
      # crates and their test binaries change on every commit and
      # are rebuilt anyway — so the cache is a fraction of the size
      # the raw `target` dir was (6.4GB, 2-3min to restore) and
      # restores in seconds. Saved from main only, so a PR's cache
      # writes cannot evict the one every other branch restores.
      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        # llvm-18-dev provides both the static archives and
        # libLLVM-18.so; the builds below link the shared one
        # (`hale-codegen/dynamic-llvm`). clang-18 is also invoked at
        # test time to link compiled `.hl` fixtures.
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: Install cargo-nextest
        # Prebuilt binary — installs in seconds.
        uses: taiki-e/install-action@nextest

      - name: cargo build --release --workspace
        # Build ALL workspace members first so `libhale_ts_shim.a`
        # lands at `target/release/` before any test links against
        # it. `hale-cli` / `hale-codegen` tests invoke clang to link
        # compiled .hl fixtures — codegen appends the staticlib by
        # path-probe (no cargo dep edge forces it), so going straight
        # to `cargo test` misses it (`undefined reference to
        # lotus_ts_*`).
        #
        # `--features hale-codegen/dynamic-llvm`: link the shared
        # libLLVM rather than a static copy into every binary. The
        # same flag on the nextest run below, or cargo would build
        # the workspace twice under two feature sets.
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: hale fmt --check (canonical-form gate)
        # The styleguide's §5 fmt tier: the repo's own .hl surface
        # must be canonical. Partition 1 only — the check is
        # whole-repo and takes <1s; running it 3× adds nothing.
        if: matrix.part == 1
        run: |
          # Whole repo, not an enumerated list. The list form silently
          # excluded tests/hale (the in-language suite), which drifted
          # out of canonical form unnoticed — an enumerated scope is a
          # scope that goes stale every time a directory is added.
          ./target/release/hale fmt --check .

      - name: Warm the DNA toolchain cache
        # The first host verb of this binary builds the host and the membrane
        # client into the cache: paid once here, not inside a test's own
        # deadline beside the partition's other organisms on a loaded runner.
        env:
          HALE_DNA_DISCOVER: "off"
        run: ./target/release/hale dna new "$RUNNER_TEMP/warm-cache"

      - name: cargo nextest run (cli part ${{ matrix.part }}/3)
        # Everything the other families do not own: hale-cli's 111
        # binaries less the DNA fixture suite, plus hale-lsp,
        # hale-iris and hale-dna. `hash:I/N` partitions by test name
        # within that set — a test always lands on the same part, so
        # a flake is reproducible to its part. `hale-cli/dynamic-llvm`
        # is a passthrough to hale-codegen's feature: cargo only
        # accepts `pkg/feature` for a selected package, and the same
        # feature set as the build above keeps it from rebuilding.
        run: |
          cargo nextest run --release --workspace \
            --exclude hale-codegen --exclude hale-syntax --exclude hale-types \
            --exclude hale-model --exclude hale-stdlib --exclude hale-corpus \
            --features hale-cli/dynamic-llvm \
            -E 'not binary(dna_native_suite)' \
            --partition hash:${{ matrix.part }}/3

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  codegen:
    name: codegen ${{ matrix.half }}/2
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        half: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo build --release --workspace
        # For `libhale_ts_shim.a` (see the cli job).
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: cargo nextest run (hale-codegen tests, half ${{ matrix.half }}/2)
        # Split by FILE, not by test: each file under
        # crates/hale-codegen/tests/ is its own binary, and naming
        # half of them with `--test` is what makes cargo compile only
        # that half. Half 1 also takes the lib's unit tests.
        run: |
          set -euo pipefail
          tests=$(ls crates/hale-codegen/tests/*.rs | xargs -n1 basename | sed 's/\.rs$//' \
            | sort | awk -v h=${{ matrix.half }} 'NR % 2 == h % 2' | sed 's/^/--test /')
          lib=""; [ "${{ matrix.half }}" = "1" ] && lib="--lib"
          echo "$(echo "$tests" | wc -l) test binaries in this half"
          cargo nextest run --release -p hale-codegen --features dynamic-llvm $lib $tests

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  dna:
    name: dna ${{ matrix.part }}/2
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    services:
      knowledge-db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: dna
          POSTGRES_PASSWORD: dna
          POSTGRES_DB: dna
        ports:
          - 5480:5432
        options: >-
          --health-cmd "pg_isready -U dna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HALE_DNA_KNOWLEDGE_DSN: postgres://dna:dna@127.0.0.1:5480/dna?sslmode=disable
      GIT_CONFIG_COUNT: "2"
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: "0"
      GIT_CONFIG_KEY_1: receive.autogc
      GIT_CONFIG_VALUE_1: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo build --release --workspace
        # The fixtures run through the `hale` binary this builds.
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: Warm the DNA toolchain cache
        # The first host verb of this binary builds the host and the membrane
        # client into the cache: paid once here, not inside a test's own
        # deadline beside seven other organisms on a loaded runner.
        env:
          HALE_DNA_DISCOVER: "off"
        run: ./target/release/hale dna new "$RUNNER_TEMP/warm-cache"
      - name: cargo nextest run (DNA fixture suite, part ${{ matrix.part }}/2)
        # The suite alone on its runner: sixteen slice tests, hashed
        # across two jobs, running four-wide (the `dna-fixtures`
        # group in .config/nextest.toml) now that nothing else
        # competes for the four cores.
        run: |
          cargo nextest run --release -p hale-cli --features dynamic-llvm \
            --test dna_native_suite \
            --partition hash:${{ matrix.part }}/2

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The Iris cockpit and the DNA service API (GH #690): the read
  # contract's fixtures and validator, the API's own native tests, the
  # shared query layer's Git-record fixtures, and the cockpit's browser
  # cases against the real API. Its own job, on the same build the dna
  # partitions make, so its ~3 min never sits on the critical path of a
  # partition that is already the longest.
  cockpit:
    name: cockpit (DNA API + Iris browser)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      HALE_DNA_DISCOVER: "off"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: cargo build --release --workspace
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: DNA read API contract and integration
        # The fixtures own their Git environment: no GIT_CONFIG_* here, and
        # the system config disabled, which definition_drafts_api_test asserts.
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          export HALE_API_CONTRACT_ROOT="$PWD/dna/api/contract/v1"
          export HALE_BIN="$PWD/target/release/hale"
          ./target/release/hale test dna/api/contract/v1/tests
          ./target/release/hale check dna/api
          ./target/release/hale build dna/api
          HALE_API_BIN="$PWD/dna/api/api" \
            ./target/release/hale test dna/api/tests
          # Domain fixtures own temporary Git roots and do not need a database.
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/target/release/hale" test "$GITHUB_WORKSPACE/dna/operations/tests")

      - name: Set up Node for cockpit browser tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: iris/cockpit/package-lock.json

      - name: Warm the DNA toolchain cache for the browser fixtures
        # The browser fixtures create fresh projects with `hale dna new`
        # under a per-process CPU budget; the first host build of this
        # binary must not be the one that pays for it.
        run: ./target/release/hale dna new "$RUNNER_TEMP/warm-cache"

      - name: Iris cockpit browser integration
        working-directory: iris/cockpit
        run: |
          npm ci
          npx playwright install --with-deps chromium --only-shell
          HALE_BIN="$GITHUB_WORKSPACE/target/release/hale" \
            HALE_API_BIN="$GITHUB_WORKSPACE/dna/api/api" npm test

      - name: Preserve cockpit browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: iris-cockpit-browser-failures
          path: iris/cockpit/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # GH #912 E2 — the two shapes cargo-nextest never runs.
  #
  # Every job above goes through nextest, which gives each test its
  # own process and skips doctests entirely. So two failure shapes
  # are invisible here and land only on whoever types `cargo test`:
  #
  #   * libtest runs a binary's tests as THREADS of one process, so
  #     anything process-wide two tests in the same file touch — the
  #     environment, the cwd, a fixed temp path — races. The suite is
  #     structurally clean of that today (`harness::unique_bin`, the
  #     `BuildOptions` knobs of GH #843, `harness_paths_are_unique`);
  #     this job is what keeps it clean.
  #   * `cargo test --doc` compiles the code blocks in `///` and
  #     `//!` comments as Rust, INDENTED blocks included — no fence
  #     needed to become a doctest. An indented ABI sketch in
  #     `channels/mod.rs` had made `cargo test -p hale-codegen` exit
  #     101 since 2026-05-25, and nothing in CI could see it.
  #
  # Scope, measured on 2026-09-20. The whole in-process shape
  # (`-p hale-codegen -p hale-cli --lib --tests`) is 452 test
  # binaries to compile — the `codegen` half-job spends ~4min on 167
  # of them — plus 190s of run time for hale-codegen alone on a
  # 16-core box; against a slowest job of 5m47s (run 35552221931)
  # that job would be the new critical path, several times over. So:
  # doctests for the whole workspace, which cost only the lib builds
  # the workspace build already does, and the thread shape for the
  # binaries that actually share process-wide state — the ones that
  # reach for a build knob which used to be a process-env var
  # (`harness::build_ir_text` / `build_asan` / `set_build_env_var`),
  # take a cross-test lock file, or hardcode a multicast group, plus
  # everything `.config/nextest.toml` already had to put in a
  # `max-threads` group. 32 binaries and 41s of run time, and the
  # list is COMPUTED rather than listed, so a new test that reaches
  # for one of those joins the gate by itself. `dna_native_suite` is
  # the one group member left out by name: it is 380-415s on its own
  # and has two jobs of its own above.
  # GH #970: the cross build, end to end. A foreign Linux triple links
  # here through zig and a target sysroot; this job builds the sysroots
  # the way a user would (`scripts/target-sysroot.sh`, cached on their
  # inputs — OpenSSL from source is a minute each), cross-compiles from
  # the x86_64 runner, and RUNS the results, so "it links" is not the
  # claim — "it runs on the target" is: aarch64 gnu under
  # qemu-user-static with the target's glibc, aarch64 musl under qemu
  # alone (static), and x86_64 musl directly on the runner — a static
  # binary is foreign to a glibc host in name only. The macOS workflow
  # does the Mac→Linux half up to the ELF header; this is the only place
  # an emitted cross binary executes.
  cross:
    name: cross (x86_64 → aarch64 gnu + musl, x86_64 musl; runs them)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: 0.16.0
      CROSS_TRIPLE: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (+ each target's std for the ts-shim)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: false

      - name: Install LLVM 18 + clang + qemu (+ the target's glibc for it)
        # qemu-user runs the aarch64 ELF but not on its own: the binary
        # asks for /lib/ld-linux-aarch64.so.1 and libc, which have to be
        # the TARGET's. libc6-arm64-cross puts those under
        # /usr/aarch64-linux-gnu, and `-L` points qemu there.
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev \
            qemu-user-static libc6-arm64-cross

      - name: Install zig ${{ env.ZIG_VERSION }}
        # The release tarball, pinned: zig is the cross C toolchain and
        # its version is part of the runtime object cache key.
        run: |
          set -eux
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$HOME"
          echo "$HOME/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Cache the target sysroots
        id: sysroot
        uses: actions/cache@v4
        with:
          path: ~/.cache/hale/sysroot
          key: sysroots-gnu+musl-zig${{ env.ZIG_VERSION }}-${{ hashFiles('scripts/target-sysroot.sh', 'crates/hale-ts-shim/Cargo.toml', 'crates/hale-codegen/runtime/lotus_treesitter.rs', 'Cargo.lock') }}

      - name: cargo build --release --workspace
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: Build the target sysroots (OpenSSL, zlib, ts-shim per target)
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          set -eux
          for t in aarch64-unknown-linux-gnu aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            scripts/target-sysroot.sh "$t"
          done

      - name: Cross-build and run under qemu
        run: |
          set -eux
          zig version
          cat ~/.cache/hale/sysroot/"$CROSS_TRIPLE"/VERSIONS
          mkdir -p /tmp/cross
          cat > /tmp/cross/hello.hl <<'HL'
          type Tick { n: Int; }

          locus Sub {
              bus { subscribe "tick" as on_tick of type Tick; }
              fn on_tick(t: Tick) {
                  println("worker got tick ", t.n);
              }
          }

          main locus App {
              params {
                  sub: Sub = Sub { };
              }
              placement {
                  sub: cooperative(pool = jobs);
              }
              bus { publish "tick" of type Tick; }
              run() {
                  "tick" <- Tick { n: 7 };
                  std::time::sleep(200ms);
                  println("cross main done");
              }
          }

          fn main() {
              App { };
          }
          HL
          ./target/release/hale build --target "$CROSS_TRIPLE" /tmp/cross/hello.hl
          file /tmp/cross/hello | tee /tmp/cross/file.out
          grep -q 'ELF 64-bit LSB.*ARM aarch64' /tmp/cross/file.out
          test ! -e /tmp/cross/hello.o
          # The second build links from cached runtime objects.
          time ./target/release/hale build --target "$CROSS_TRIPLE" /tmp/cross/hello.hl
          out="$(qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/cross/hello)"
          echo "program output: $out"
          echo "$out" | grep -q "worker got tick 7"
          echo "$out" | grep -q "cross main done"

          # musl, aarch64: static, so qemu needs no target libc at all.
          ./target/release/hale build --target aarch64-unknown-linux-musl /tmp/cross/hello.hl
          file /tmp/cross/hello | tee /tmp/cross/file.out
          grep -q 'ELF 64-bit LSB.*ARM aarch64.*statically linked' /tmp/cross/file.out
          out="$(qemu-aarch64-static /tmp/cross/hello)"
          echo "$out" | grep -q "cross main done"

          # musl, x86_64: a cross target from this gnu host in name only —
          # the static binary runs right here.
          ./target/release/hale build --target x86_64-unknown-linux-musl /tmp/cross/hello.hl
          file /tmp/cross/hello | tee /tmp/cross/file.out
          grep -q 'ELF 64-bit LSB.*x86-64.*statically linked' /tmp/cross/file.out
          out="$(/tmp/cross/hello)"
          echo "$out" | grep -q "worker got tick 7"
          echo "$out" | grep -q "cross main done"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  parity:
    name: parity (cargo test + doctests)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: cargo build --release --workspace
        # For `libhale_ts_shim.a` (see the cli job).
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: cargo test --release --doc --workspace
        # nextest runs no doctests at all, so this is the only place
        # a `///` code block is compiled.
        run: cargo test --release --doc --workspace --features hale-codegen/dynamic-llvm

      - name: cargo test (one process per binary, libtest threads)
        run: |
          set -euo pipefail
          # Binaries the repo has already marked as sharing something,
          # minus the DNA fixture suite (see the header comment).
          grouped=$(grep -oE 'binary\([a-z0-9_]+\)' .config/nextest.toml \
            | sed 's/^binary(//; s/)$//' | sort -u \
            | grep -vx dna_native_suite || true)
          for crate in hale-codegen hale-cli; do
            dir="crates/$crate/tests"
            # A build knob that used to be a process-env var; the
            # `create_new` idiom both cross-test lock files use; a
            # hardcoded multicast group.
            marked=$(grep -lE 'build_ir_text|build_asan|set_build_env_var|create_new\(true\)|239\.' \
              "$dir"/*.rs 2>/dev/null | xargs -n1 basename | sed 's/\.rs$//' || true)
            names=$(printf '%s\n%s\n' "$marked" "$grouped" | sort -u \
              | while read -r n; do
                  if [ -n "$n" ] && [ -f "$dir/$n.rs" ]; then printf '%s\n' "$n"; fi
                done)
            if [ -z "$names" ]; then
              echo "$crate: no shared-state binaries"; continue
            fi
            echo "== $crate: $(printf '%s\n' "$names" | wc -l) binaries =="
            printf '%s\n' "$names"
            # hale-cli is a bin crate — it has no lib target to test.
            lib=""
            if [ "$crate" = hale-codegen ]; then lib="--lib"; fi
            args=$(printf -- '--test %s ' $names)
            cargo test --release -p "$crate" --features dynamic-llvm $lib $args
          done

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # 2026-05-26 — TSAN regression coverage for the lockfree
  # substrate paths. F.32-1γ-v2 + the substrate-race-fixes work
  # closed five originally-flagged TSAN races
  # (bus_queue_drain multi-thread flag, arena subregion mutex,
  # arena_destroy / coop_pool_worker ordering, lazy-init env
  # helpers via pthread_once) — the lockfree hashmap path
  # validates clean with an empty suppression list. This job
  # locks that in: any future regression that re-races on the
  # lockfree set / get / remove / grow paths fails CI here.
  #
  # Separate job because TSAN-instrumented binaries are ~5-15×
  # slower; running the full workspace under TSAN would gate
  # PRs on 30+ minute CI. The dedicated suite at
  # `crates/hale-codegen/tests/form_hashmap_lockfree_tsan.rs`
  # covers the substrate paths we care about + completes in
  # under a minute.
  tsan:
    needs: scope
    if: needs.scope.outputs.substrate == 'true'
    name: tsan (form_hashmap_lockfree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Dependency artifacts only (see the test job); the sanitizer
      # env vars reach clang at test time, not the Rust build, so
      # this cache is the same shape as the test job's.
      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tsan-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: cargo build --release --workspace
        # Build the whole workspace so `libhale_ts_shim.a` lands
        # at target/release/ before the test binaries try to
        # link against it — codegen tests invoke clang to link
        # compiled .hl programs, and the link surface includes
        # the ts-shim by path-probe (no cargo dep edge forces
        # it, so `-p hale-codegen` alone misses the staticlib
        # and clang errors with `undefined reference to lotus_ts_*`).
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: LOTUS_TSAN=1 cargo test (form_hashmap_lockfree_tsan)
        # The TSAN tests are #[ignore]'d so the normal suite
        # skips them; --ignored opts in. LOTUS_TSAN=1 in env
        # tells `build_executable` to pass -fsanitize=thread to
        # clang for both the runtime C compile and the binary
        # link. The C runtime's embedded
        # __tsan_default_suppressions returns empty as of
        # 2026-05-26 — any race surfaced here is a new
        # regression and gates the merge.
        env:
          LOTUS_TSAN: "1"
        run: |
          cargo test --release -p hale-codegen --features dynamic-llvm \
            --test form_hashmap_lockfree_tsan \
            -- --ignored --test-threads=1 --nocapture

  # 2026-06-02 — AddressSanitizer + LeakSanitizer coverage for the
  # compiled example corpus. The broad corpus is otherwise only
  # parse-tested + type-checked + interpreter-run (exit-0); the
  # interpreter has no arenas/pools/coros, so it can't surface the
  # teardown leaks, shutdown use-after-free, and buffer overflows
  # that keep appearing at feature intersections in real apps.
  # `corpus_oracle` compiles every runnable fixture to native and
  # runs it under the oracle battery; this job adds the sanitizer
  # arm. Three closure epoch-fire leaks are quarantined in the test
  # (KNOWN_CLOSURE_LEAKS) so the gate is green on the known state —
  # any NEW leak/UAF/overflow in any other fixture fails here.
  #
  # Separate job like tsan: ASAN-instrumented builds are slower and
  # need the wrap-malloc shim disabled, so they don't belong in the
  # normal partitions. The plain exit+deadline arm of corpus_oracle
  # DOES run in those partitions (no extra toolchain needed).
  asan:
    needs: scope
    if: needs.scope.outputs.substrate == 'true'
    name: sanitizers (asan corpus + ubsan foreign-ring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Dependency artifacts only (see the test job); the sanitizer
      # env vars reach clang at test time, not the Rust build, so
      # this cache is the same shape as the test job's.
      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: asan-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: cargo build --release --workspace
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: check/build agreement over the embedded corpus
        # `hale check` accepting what `hale build` refuses is the
        # worst failure mode the toolchain has: the error arrives
        # late, from another layer, usually without a span, and it
        # tells the author their working program is broken. Three
        # were found by accident in one afternoon; all three lived in
        # the ~1300 programs embedded in Rust test strings, which
        # were typechecked but never compiled (the 92 file fixtures
        # ARE compiled, by corpus_oracle below).
        #
        # A ratchet against a recorded baseline: a NEW divergence
        # fails, and so does a FIXED one, so the list cannot rot.
        # #[ignore]'d like the sweeps below since it compiles ~1500
        # programs; --ignored opts in. The sweep runs on every core
        # (#927: 6.7min serial on a 4-core runner, ~2min now;
        # HALE_CORPUS_SWEEP_THREADS=1 restores the serial walk).
        # Folded into this job to reuse the release build above.
        run: |
          cargo test --release -p hale-codegen --features dynamic-llvm \
            --test corpus_check_build_agreement \
            -- --ignored --nocapture

      - name: LOTUS_ASAN=1 cargo test (corpus_oracle under ASAN)
        # #[ignore]'d like the tsan suite; --ignored opts in.
        # LOTUS_ASAN=1 tells build_executable to pass
        # -fsanitize=address to clang for the runtime C compile +
        # binary link. A new leak outside KNOWN_CLOSURE_LEAKS, or
        # any UAF/overflow, gates the merge.
        env:
          LOTUS_ASAN: "1"
        run: |
          cargo test --release -p hale-codegen --features dynamic-llvm \
            --test corpus_oracle \
            -- --ignored --test-threads=1 --nocapture

      # 2026-06-08 — UBSan (+ASan) coverage for the foreign-ring
      # (`ring_layout`) boundary, folded into THIS job to reuse the
      # workspace build above (a separate job would redo the expensive
      # LLVM-linked release build for no benefit). `ring_layout` reads
      # rings written by another program, so the interesting failures
      # are at the non-conforming / hostile foreign-producer edge: a
      # record `len` that disagrees with the bound payload size, a
      # `buffer_size` that isn't an `align` multiple, a pack-read offset
      # near INT64_MAX. A review found three OOB holes there the normal
      # corpus never hit (it stays inside the safe invariants); this step
      # runs the suites that DO exercise those edges with LOTUS_UBSAN=1
      # (clang -fsanitize=address,undefined -fno-sanitize-recover), so a
      # signed-overflow / OOB / wrongful-dispatch regression aborts and
      # gates the merge. Scoped to the foreign-ring + pack tests on
      # purpose: a full-corpus UBSan run could surface unrelated latent
      # UB elsewhere (a separate effort). Leaks stay the ASan step's
      # remit (detect_leaks=0 here) so this stays focused on UB / OOB.
      - name: LOTUS_UBSAN=1 foreign-ring + pack suite (under ASan+UBSan)
        env:
          LOTUS_UBSAN: "1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          ASAN_OPTIONS: "detect_leaks=0"
        run: |
          cargo test --release -p hale-codegen --features dynamic-llvm \
            --test bytes_pack_read \
            --test shm_ring_layout \
            --test shm_ring_layout_producer \
            -- --test-threads=1 --nocapture

  # GH issue #18 item 2: model-check the substrate's concurrent
  # primitives under ALL C11 interleavings (not just the schedules a
  # test happens to hit). GenMC runs the actual C; a race / UAF /
  # assertion violation in any verification/*_model.c gates the merge.
  # No Rust/cargo — this job only needs LLVM 18 + cmake to build GenMC
  # and clang to run the models.
  genmc:
    needs: scope
    if: needs.scope.outputs.substrate == 'true'
    name: genmc (substrate race-completeness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 + clang + cmake
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev cmake

      # GenMC builds against LLVM 18 in a few minutes; cache the built
      # tree keyed on build_genmc.sh (which pins the GenMC commit), so
      # it only rebuilds when the pin / build recipe changes.
      - name: Cache GenMC build
        uses: actions/cache@v4
        with:
          path: ~/genmc
          key: genmc-llvm18-${{ hashFiles('verification/build_genmc.sh') }}

      # Build only if the cache missed OR restored a binary that no
      # longer runs (e.g. libLLVM patch bump under a stale cache).
      - name: Build GenMC if needed
        run: |
          set -eux
          if ! "$HOME/genmc/build/bin/genmc" --version >/dev/null 2>&1; then
            verification/build_genmc.sh "$HOME/genmc"
          fi

      - name: Run substrate model checks
        run: GENMC="$HOME/genmc/build/bin/genmc" verification/run_genmc.sh
