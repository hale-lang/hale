# nextest configuration for the workspace test suite.
#
# Most tests are fully process-isolated (one process per test) and
# write to per-test /tmp paths that nextest's process model already
# keeps apart. A handful of tests instead build into a committed
# fixture directory under `crates/hale-cli/tests/fixtures/` —
# they share that on-disk path and race when run in parallel
# (test A deletes the built binary at preamble while test B is
# between its successful build and its `read(&built_bin)`, dropping
# B with ENOENT). The libtest --test-threads=1 flag avoids the
# same race locally; this file is the nextest equivalent.
#
# `test-group = { max-threads = N }` caps only the binaries named
# below (N = 1 serializes them); everything else stays fully parallel.

# Hard per-test timeout. nextest has none by default, so a single
# hung test (a socket/subprocess test that deadlocks on a CI
# port/PID race, say) wedges its whole partition until GitHub's 6h
# job cap — observed as a 33-minute "still running" with no progress.
# `period` warns (SLOW) and `terminate-after` kills + fails the test
# after period * N. 8 minutes is well clear of the slowest legitimate
# test (the compiled-corpus oracle builds dozens of binaries) while
# turning an indefinite wedge into a fast, named failure.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 8 }

[[profile.default.overrides]]
filter = 'binary(three_hop_import)'
test-group = 'shared-fixture-dir'

[[profile.default.overrides]]
# The DNA native suite is one test that runs every `dna/tests` fixture:
# live hosts, bodies with their lease and fence, knowledge services, the
# books acceptance slice. On CI it takes 380-415s on a quiet runner and
# ran past the 8-minute limit above on a loaded one, a timeout rather
# than a failure. It gets 15 minutes; a real wedge still ends in a named
# failure.
filter = 'binary(dna_native_suite)'
slow-timeout = { period = "60s", terminate-after = 15 }
# The suite is sliced (2026-09-19) so CI's hash partition spreads it,
# and the slices that land on one job run beside each other
# (2026-09-20): ports are picked free per fixture, and each slice
# creates its own knowledge database out of the job's DSN rather than
# sharing the one database the job names. Four at a time: the suite
# has CI jobs of its own (`dna` in tests.yml), so nothing else
# competes for the runner's four cores, and every fixture builds and
# boots an organism, so more than one per core would widen the
# bounded waits the fixtures already run scaled (GH #795). Each slice
# keeps the 15-minute allowance above.
test-group = 'dna-fixtures'

[[profile.default.overrides]]
# UDP tests hardcode multicast groups (239.255.x) + ports; two running
# concurrently cross-talk / collide on the group:port pair (the #178
# loopback flake class). Serialize them against each other.
filter = 'binary(bus_udp_transport) | binary(udp_multicast) | binary(udp_p4_source_and_timeout) | binary(udp_primitives)'
test-group = 'serial-udp'

[test-groups]
shared-fixture-dir = { max-threads = 1 }
dna-fixtures = { max-threads = 4 }
serial-udp = { max-threads = 1 }
