<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>todo</title>
<style>
  body { font: 16px/1.4 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  #status { color: #666; font-size: .85rem; margin-bottom: 1rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; gap: .6rem; align-items: baseline; padding: .35rem 0; border-bottom: 1px solid #eee; }
  li.done .title { text-decoration: line-through; color: #888; }
  li.overdue .due { color: #b00020; font-weight: 600; }
  li.fresh { background: #fffbe0; }
  .id { color: #999; font-variant-numeric: tabular-nums; min-width: 2rem; }
  .due { margin-left: auto; font-size: .85rem; color: #666; white-space: nowrap; }
  #empty { color: #888; }
</style>
</head>
<body>
<h1>todo</h1>
<div id="status">connecting…</div>
<ul id="items"></ul>
<p id="empty" hidden>Nothing to do.</p>

<script type="module">
// One static page, no framework. It observes: the list comes from the hub
// (a `list` call frame), and every later change from the stream the hub
// binds to the TodoChanged topic, through the generated client. The token
// is the page's URL: ?token=t-bo (&hub=ws://host:port when the hub is not
// on this host's port 8081).
import { subscribeTodoChanged } from "./client/todo.js";

const params = new URLSearchParams(location.search);
const token = params.get("token") ?? "";
const hub = params.get("hub") ?? `ws://${location.hostname || "127.0.0.1"}:8081`;

const status = document.getElementById("status");
const list = document.getElementById("items");
const empty = document.getElementById("empty");
const items = new Map(); // id -> item, as the api sends it

function render(freshId) {
  const sorted = [...items.values()].sort((a, b) => a.id - b.id);
  list.replaceChildren(...sorted.map((it) => {
    const li = document.createElement("li");
    li.className = [it.done ? "done" : "", it.overdue ? "overdue" : "", it.id === freshId ? "fresh" : ""].join(" ").trim();
    for (const [cls, text] of [["id", "#" + it.id], ["title", it.title], ["due", it.due ? "due " + it.due : ""]]) {
      const span = document.createElement("span");
      span.className = cls;
      span.textContent = text;
      li.append(span);
    }
    return li;
  }));
  empty.hidden = items.size > 0;
}

function apply(change) {
  if (change.what === "removed") items.delete(change.item.id);
  else items.set(change.item.id, change.item);
  render(change.what === "removed" ? -1 : change.item.id);
}

// The list as it stands: a call frame on its own connection (a page on
// another origin cannot fetch the api, but a WebSocket crosses origins).
function fetchList() {
  return new Promise((resolve, reject) => {
    const url = new URL(hub);
    url.searchParams.set("access_token", token);
    const ws = new WebSocket(url);
    ws.onopen = () => ws.send(JSON.stringify({ type: "call", id: "list", call: "Todos::list", payload: {} }));
    ws.onmessage = (m) => {
      const frame = JSON.parse(m.data);
      if (frame.type !== "reply" || frame.id !== "list") return;
      ws.close();
      if (frame.ok) resolve(JSON.parse(frame.value.json));
      else reject(new Error("the list was refused: " + JSON.stringify(frame)));
    };
    ws.onerror = () => reject(new Error("the hub at " + hub + " cannot be reached"));
  });
}

async function run() {
  const sub = subscribeTodoChanged({ endpoint: hub, bearer: token });
  let snapshot = false;
  const early = []; // changes that arrive before the list does
  for await (const ev of sub) {
    if (ev.kind === "subscribed") {
      status.textContent = "live · " + hub;
      fetchList().then((all) => {
        for (const it of all) items.set(it.id, it);
        snapshot = true;
        for (const c of early.splice(0)) apply(c);
        render(-1);
      }, (e) => { status.textContent = String(e); });
    } else if (ev.kind === "event") {
      if (snapshot) apply(ev.payload); else early.push(ev.payload);
    } else {
      status.textContent = ev.kind === "refusal" ? "refused: " + ev.refusal.reason : "the stream ended (" + ev.kind + ")";
    }
  }
}

run().catch((e) => { status.textContent = String(e); });
</script>
</body>
</html>
