# Rendered by `hale deploy render` from svc: a pure function of the checked program.
# Build each program first (`hale build <seed>`); a service runs its built binary from
# the mount, in a glibc image compatible with the build host.
services:
  svc:
    image: debian:stable-slim
    working_dir: /app
    volumes:
      - "svc:/app:ro"
    command: ["/app/svc"]
    ports:
      - "127.0.0.1:9100:9100"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 2s
      retries: 30
