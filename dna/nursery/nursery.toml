# The toolchain's nursery: the packs `hale dna pack` offers when no
# `--from` names another. A nursery is a directory or a git repository with
# this index at its root; each entry is a pack, a batch of steps
# (`hale dna apply`'s language) with `{param}` placeholders. A line that
# begins `? ` is kept only when every parameter it names is set.

[[pack]]
name = "dev-team"
version = "1"
path = "packs/dev-team.pack"
summary = "a dev and a reviewer for one part, and the practices they review by"
params = { part = "", dev = "", reviewer = "" }

[[pack]]
name = "small-startup"
version = "1"
path = "packs/small-startup.pack"
summary = "a product lead and one dev team: the smallest company that ships"
params = { part = "app", founder = "" }

[[pack]]
name = "content-team"
version = "1"
path = "packs/content-team.pack"
summary = "a team that ships no code: an editor and a writer, briefs and published pieces"
params = { team = "content", editor = "", writer = "" }

[[pack]]
name = "founder"
version = "1"
path = "packs/founder.pack"
summary = "one person holds every seat the organization leaves open: the Board, each part's dev and reviewer, each operator"
params = { founder = "" }

[[pack]]
name = "standard"
version = "1"
path = "packs/standard.pack"
summary = "the standard practices every organism adopts at birth, each proposed as law: first, logs are structured; and a template per watched upstream"
params = { integration = "", position = "", source = "", kind = "", every = "", codebase = "none" }

[[pack]]
name = "habitat"
version = "1"
path = "packs/habitat.pack"
summary = "the habitat's fixed positions: placement, backends, identity and admission"
params = { holder = "" }

[[pack]]
name = "hale-organism"
version = "1"
path = "packs/hale-organism.pack"
summary = "the hale organism's positions and their mandates: the compiler, the DNA, voice, and review before merge"
params = { board = "" }

# Saplings: organisms' seeds, each pinned by repository, revision and
# digest (the sha256 of `git ls-tree -r --full-tree <revision>`), with the
# packs it adopts at graft. `hale habitat graft <name>` fetches the pinned
# revision into the habitat's store, checks the digest and grafts it; a
# newer revision here is filed for the habitat's Board, never taken.

[[sapling]]
name = "voice"
summary = "distributed inference: one endpoint over local hosts and hosted providers, with routing, projects, budgets and rate limits"
repo = "https://github.com/hale-lang/voice"
revision = "d4d3db32319acbb607a2c3327b6796583bddbec5"
digest = "sha256:bae66d743c8affe87332aa10dfc666964394d25cead9189a7d68b66083989708"
packs = []

# The hale organism (D8): the organism that works on the Hale toolchain. Its
# genome is a small repository of its own, the tree checked in at
# saplings/hale; its codebases (hale-lang/hale, hale-lang/voice) are listed
# in that tree's hale.toml and attached at its graft. PLACEHOLDER: the
# repository below is not created yet. Until it is, `revision` is its main
# branch and `digest` the checked-in tree's (a test holds the two equal);
# a fixture grafts it from a local repository built from that tree. Once it
# exists, the tree is pushed there and the revision pinned to the commit.
[[sapling]]
name = "hale"
summary = "the organism that works on the Hale toolchain: its codebases are hale-lang/hale and hale-lang/voice"
repo = "https://github.com/hale-lang/hale-organism"
revision = "main"
digest = "sha256:c4b20c40f58e06730cfeda00d896e7946f07afe45a6ff8e85200871d8f9b56dd"
packs = ["hale-organism"]
