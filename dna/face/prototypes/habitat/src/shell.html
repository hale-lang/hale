  #hale-habitat-wireframe .ui-kv dt { color: var(--habitat-muted); }
  #hale-habitat-wireframe .ui-kv dd { margin: 0; overflow-wrap: anywhere; }
  #hale-habitat-wireframe .ui-split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  #hale-habitat-wireframe .ui-stack { display: grid; gap: 12px; }
  #hale-habitat-wireframe .ui-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
  #hale-habitat-wireframe .ui-list { margin: 0; padding: 0; list-style: none; }
  #hale-habitat-wireframe .ui-list > li, #hale-habitat-wireframe .ui-list > .ui-row { padding: 12px 0; border-bottom: 1px solid var(--habitat-line); }
  #hale-habitat-wireframe code, #hale-habitat-wireframe .ui-code { font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
  #hale-habitat-wireframe pre.ui-code { white-space: pre-wrap; padding: 14px; background: var(--habitat-bar); border-radius: 6px; }
  #hale-habitat-wireframe .ui-note { padding: 12px 14px; margin: 16px 0; background: var(--habitat-bar); border-left: 2px solid var(--habitat-line); font-size: 13px; }
  #hale-habitat-wireframe .ui-empty { padding: 20px 0; color: var(--habitat-muted); }
  #hale-habitat-wireframe .ui-after { margin-top: 14px; }
  #hale-habitat-wireframe .ui-steps { list-style: decimal; padding-left: 20px; margin: 0; }
  #hale-habitat-wireframe .ui-steps li { padding: 7px 0 7px 4px; }
  #hale-habitat-wireframe .ui-steps span { display: block; color: var(--habitat-muted); font-size: 13px; margin-top: 3px; }
  #hale-habitat-wireframe .ui-face-preview { border: 1px solid var(--habitat-line); border-radius: 8px; background: var(--habitat-bar); overflow: hidden; }
  #hale-habitat-wireframe .ui-face-preview-bar { display: flex; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--habitat-line); }
  #hale-habitat-wireframe .ui-face-preview-body { display: grid; grid-template-columns: 110px minmax(0, 1fr); min-height: 160px; }
  #hale-habitat-wireframe .ui-face-preview-body > div { padding: 18px; }
  #hale-habitat-wireframe .ui-face-preview-nav { border-right: 1px solid var(--habitat-line); display: flex; flex-direction: column; gap: 12px; color: var(--habitat-muted); font-size: 12px; }
  #hale-habitat-wireframe .habitat-inspector { width: min(660px, calc(100% - 32px)); max-height: calc(100% - 40px); padding: 0; background: var(--habitat-bar); color: var(--habitat-text); border: 1px solid var(--habitat-line); border-radius: 10px; }
  #hale-habitat-wireframe .habitat-inspector::backdrop { background: rgb(0 0 0 / 45%); }
  #hale-habitat-wireframe .habitat-inspector-bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--habitat-line); }
  #hale-habitat-wireframe .habitat-inspector-content { padding: 24px; }
  #hale-habitat-wireframe .habitat-inspector-content p { color: var(--habitat-muted); margin: 0 0 16px; }
  #hale-habitat-wireframe .habitat-status { margin: 0; padding: 0 24px; color: var(--habitat-muted); }
  #hale-habitat-wireframe .habitat-status:not(:empty) { padding-bottom: 16px; }
  @media (max-width: 420px) {
    #hale-habitat-wireframe .habitat-topbar { padding-inline: 16px; }
    #hale-habitat-wireframe .habitat-account { gap: 4px; }
    #hale-habitat-wireframe .habitat-control { padding-inline: 8px; }
    #hale-habitat-wireframe .habitat-topbar { flex-wrap: wrap; }
    #hale-habitat-wireframe .habitat-account { margin-left: auto; }
  }
  @media (max-width: 640px) {
    #hale-habitat-wireframe .habitat-canvas { padding: 28px 16px; }
    #hale-habitat-wireframe .habitat-organism-row { grid-template-columns: minmax(0, 1fr) auto; gap: 12px; }
    #hale-habitat-wireframe .habitat-access { grid-column: 1; }
    #hale-habitat-wireframe .habitat-row-actions { grid-column: 2; grid-row: span 2; }
    #hale-habitat-wireframe .habitat-organism-shell { grid-template-columns: minmax(0, 1fr); }
    #hale-habitat-wireframe .habitat-sidebar { border-right: 0; border-bottom: 1px solid var(--habitat-line); }
    #hale-habitat-wireframe .habitat-parts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #hale-habitat-wireframe .habitat-part-page { padding: 24px 16px; min-height: 300px; }
    #hale-habitat-wireframe .ui-split { grid-template-columns: minmax(0, 1fr); gap: 12px; }
    #hale-habitat-wireframe .ui-kv { gap: 8px 12px; }
    #hale-habitat-wireframe .ui-table { min-width: 390px; }
  }
  @media (pointer: coarse) {
    #hale-habitat-wireframe .habitat-control { min-height: 44px; }
    #hale-habitat-wireframe .habitat-part-link, #hale-habitat-wireframe .habitat-return { min-height: 44px; }
    #hale-habitat-wireframe .ui-button { min-height: 44px; }
  }

/* GRAPH_CSS */
</style>
<script>
(() => {
  const root = document.getElementById('hale-habitat-wireframe');
  const login = root.querySelector('[data-action="login"]');
  const account = root.querySelector('[data-action="account"]');
  const logout = root.querySelector('[data-action="logout"]');
  const picker = root.querySelector('.habitat-theme');
  const status = root.querySelector('.habitat-status');
  const list = root.querySelector('.habitat-organisms');
  const detail = root.querySelector('.habitat-detail');
  const detailTitle = root.querySelector('#detail-title');
  const canvas = root.querySelector('.habitat-canvas');
  const organismShell = root.querySelector('.habitat-organism-shell');
  const partNav = root.querySelector('.habitat-parts');
  const partContent = root.querySelector('.habitat-part-content');
  const inspector = root.querySelector('.habitat-inspector');
  const inspectorContent = root.querySelector('.habitat-inspector-content');
  let renderedPart = '';
  const parts = [
    ['head', 'Head', 'Identity, sessions, and command admission.', 'API & sessions'],
    ['face', 'Face', 'The interfaces this organism serves.', 'User interfaces'],
    ['heart', 'Heart', 'The application and its pulse.', 'Application'],
    ['spine', 'Spine', 'Workflow execution, coordination, and settlement.', 'Workflow execution'],
    ['nerves', 'Nerves', 'Signals between the organism’s parts.', 'Messaging'],
    ['memory', 'Memory', 'Working knowledge, claims, and protected evidence.', 'Working knowledge'],
    ['record', 'Record', 'Decisions and provenance, preserved in order.', 'Decision history'],
    ['genome', 'Genome', 'Application source, organization, and vendored DNA.', 'Source & organization'],
    ['body', 'Body', 'The hosts and infrastructure the organism runs on.', 'Hosts & infrastructure'],
    ['legs', 'Legs', 'Workers and their attempts.', 'Workers'],
    ['hands', 'Hands', 'The tools workers use to act.', 'Tools'],
    ['hat', 'Hat', 'Scoped context for a unit of work.', 'Work context'],
    ['voice', 'Voice', 'Models, adapters, and the record of their calls.', 'Models'],
    ['senses', 'Senses', 'Readings from the organism’s running parts.', 'Observability'],
    ['reflexes', 'Reflexes', 'Operational reactions that need no plan.', 'Automatic responses'],
    ['skin', 'Skin', 'Credentials, access, and trust boundaries.', 'Trust & credentials']
  ];
  const organismAccess = { Atlas: 'Can manage', Relay: 'Can contribute', Fieldwork: 'Can view' };
  function glyph(id) {
    return `<svg class="habitat-glyph" viewBox="0 0 24 24" aria-hidden="true"><use href="#habitat-icon-${id}"></use></svg>`;
  }
  partNav.innerHTML = parts.map(([id, label, purpose, caption]) => `<button type="button" class="habitat-part-link cursor-interaction" data-part="${id}">${glyph(id)}<span class="habitat-part-label"><span class="habitat-part-name">${label}</span><span class="habitat-part-caption">${caption}</span></span></button>`).join('');
  const themes = ['system', 'light', 'dark', 'midnight', 'forest'];
  const savedState = window.habitatPreview?.widgetState?.privateContent;
  let signedIn = savedState?.previewVersion === 3 ? savedState.signedIn === true : true;
  let activeView = savedState?.previewVersion === 3 ? savedState.activeView || 'organism' : 'organism';
  let currentOrganism = Object.hasOwn(organismAccess, savedState?.currentOrganism) ? savedState.currentOrganism : 'Atlas';
  let currentPart = parts.some(part => part[0] === savedState?.currentPart) ? savedState.currentPart : 'head';
  let theme = window.habitatPreview?.widgetState?.privateContent?.theme || 'system';
  if (!themes.includes(theme)) theme = 'system';
  // GRAPH_ENGINE
  function render() {
    if (!signedIn || activeView !== 'organism' || currentOrganism !== 'Atlas') leaveActivityScope();
    root.dataset.theme = theme;
    picker.value = theme;
    login.hidden = signedIn;
    account.hidden = !signedIn;
    logout.hidden = !signedIn;
    list.hidden = !signedIn || activeView !== 'organisms';
    organismShell.hidden = !signedIn || activeView !== 'organism';
    canvas.classList.toggle('is-organism', signedIn && activeView === 'organism');
    detail.hidden = !signedIn || activeView === 'organisms' || activeView === 'organism';
    detailTitle.textContent = activeView;
    root.querySelector('.habitat-context-name').textContent = currentOrganism;
    root.querySelector('.habitat-context-access').textContent = organismAccess[currentOrganism];
    const part = parts.find(part => part[0] === currentPart);
    root.querySelector('#part-title').textContent = part[1];
    root.querySelector('.habitat-part-purpose').textContent = part[2];
    root.querySelector('.habitat-part-symbol').innerHTML = glyph(part[0]);
    const pageKey = currentOrganism + ':' + currentPart;
    if (renderedPart !== pageKey) {
      const template = root.querySelector(currentOrganism === 'Atlas' ? '#page-' + currentPart : '#page-empty');
      partContent.replaceChildren();
      if (template) partContent.append(template.content.cloneNode(true));
      partContent.querySelectorAll('button, a').forEach(control => {
        control.classList.add('cursor-interaction');
        if (control.tagName === 'BUTTON') control.type = 'button';
      });
      renderedPart = pageKey;
      if (currentOrganism === 'Atlas') mountGraphPage();
    }
    partNav.querySelectorAll('[data-part]').forEach(button => {
      if (button.dataset.part === currentPart) button.setAttribute('aria-current', 'page');
      else button.removeAttribute('aria-current');
    });
    status.textContent = '';
    if (activityIsVisible() && activityScope !== activityKey()) renderGraphWorkspace();
  }
  function save() {
    if (window.habitatPreview?.setWidgetState) {
      window.habitatPreview.setWidgetState({
        modelContent: { accountPreview: signedIn ? 'signed-in' : 'signed-out', theme, view: activeView, organism: currentOrganism, part: currentPart, graphSelection, perspective: currentGraphView()?.id, activityEvent: currentActivityEvent()?.id || null },
        privateContent: { signedIn, theme, activeView, currentOrganism, currentPart, previewVersion: 3, graphSelection, graphPerspectives, graphMode, graphFilters, spatialProjection, spatialRelated, spatialHiddenDimensions, activityCursors, activityLog }
      }).catch(() => {});
    }
  }
  login.addEventListener('click', () => { signedIn = true; activeView = 'organisms'; render(); save(); });
  logout.addEventListener('click', () => { signedIn = false; activeView = 'organisms'; render(); save(); });
  picker.addEventListener('change', () => { theme = picker.value; render(); save(); });
  account.addEventListener('click', () => { activeView = 'Account'; render(); save(); });
  function showOrganisms() { activeView = 'organisms'; render(); save(); }
  root.querySelector('[data-action="back"]').addEventListener('click', showOrganisms);
  root.querySelector('[data-action="organisms"]').addEventListener('click', showOrganisms);
  root.querySelectorAll('[data-preview]').forEach(button => {
    button.addEventListener('click', () => {
      const destination = button.dataset.preview;
      if (Object.hasOwn(organismAccess, destination)) {
        currentOrganism = destination;
        currentPart = 'head';
        activeView = 'organism';
      } else activeView = destination;
      render(); save();
    });
  });
  partNav.querySelectorAll('[data-part]').forEach(button => {
    button.addEventListener('click', () => { currentPart = button.dataset.part; render(); save(); });
  });
  root.querySelector('[data-close-inspector]').addEventListener('click', () => inspector.close());
  root.addEventListener('click', event => {
    const target = event.target.closest('button, a');
    if (!target || !root.contains(target)) return;
    if (target.dataset.goOrganism === 'Atlas') {
      currentOrganism = 'Atlas';
      activeView = 'organism';
      render(); save();
    } else if (target.dataset.goPart) {
      if (!parts.some(part => part[0] === target.dataset.goPart)) return;
      if (inspector.open) inspector.close();
      currentPart = target.dataset.goPart;
      activeView = 'organism';
      render(); save();
    } else if (target.dataset.inspect) {
      const template = Array.from(partContent.querySelectorAll('template[data-detail]')).find(template => template.dataset.detail === target.dataset.inspect);
      if (!template) return;
      inspectorContent.replaceChildren(template.content.cloneNode(true));
      inspectorContent.querySelectorAll('button, a').forEach(control => {
        control.classList.add('cursor-interaction');
        if (control.tagName === 'BUTTON') control.type = 'button';
      });
      if (!inspector.open) inspector.showModal();
    }
  });
  window.addEventListener('habitat:state', event => {
    const saved = event.detail?.globals?.widgetState;
    if (saved) {
      signedIn = saved.privateContent?.previewVersion === 3 ? saved.privateContent.signedIn === true : true;
      if (saved.privateContent?.previewVersion === 3) {
        activeView = saved.privateContent.activeView || 'organism';
        if (Object.hasOwn(organismAccess, saved.privateContent.currentOrganism)) currentOrganism = saved.privateContent.currentOrganism;
        if (parts.some(part => part[0] === saved.privateContent.currentPart)) currentPart = saved.privateContent.currentPart;
      }
      theme = themes.includes(saved.privateContent?.theme) ? saved.privateContent.theme : 'system';
      const incomingSelection = saved.privateContent?.graphSelection;
      graphSelection = incomingSelection && (incomingSelection.kind === 'node' ? graphEntities : graphRelations).has(incomingSelection.id) ? incomingSelection : null;
      graphPerspectives = saved.privateContent?.graphPerspectives || {};
      graphMode = saved.privateContent?.graphMode === 'outline' ? 'outline' : 'graph';
      graphFilters = validateGraphFilters(saved.privateContent?.graphFilters);
      restoreSpatialState(saved.privateContent);
      restoreActivityState(saved.privateContent);
      render();
      renderGraphWorkspace();
    }
  });
  render();
})();
</script>
