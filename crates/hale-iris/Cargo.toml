[package]
name = "hale-iris"
version.workspace = true
edition.workspace = true
description = "The iris observer's sources, embedded so `hale iris` ships in the hale binary (GH #527 B3)"

[dependencies]
hale-dna = { path = "../hale-dna" }
# The workspace's one FNV fold (F.40 phase 4, I6), which the cache key
# is; dependency-free.
hale-graph = { path = "../hale-graph" }

[build-dependencies]
# The identity list and walk (F.40 phase 0 step 0.4); dependency-free.
hale-graph = { path = "../hale-graph" }

[dev-dependencies]
# The cache key's tests hold the stdlib's embedded seeds against the
# selection `HALE_COMPILER_SRC_HASH` folds (F.40 phase 4, I5).
hale-stdlib = { path = "../hale-stdlib" }
