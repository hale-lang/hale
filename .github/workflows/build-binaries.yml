name: build-binaries

# The release tarballs, built once per platform and uploaded as the run's
# artifacts `hale-<target>` (the tarball and its .sha256): the build half of
# release.yml (a `v*` tag) and of nightly.yml (main, daily), which each
# publish them their own way. Moved here unchanged from release.yml's
# `build` job; see release.yml for why these three platforms.
#
#   - Linux x86_64 (ubuntu-24.04)
#   - Linux arm64 (ubuntu-24.04-arm)
#   - macOS Apple Silicon arm64 (macos-15)

on:
  workflow_call:
    inputs:
      name:
        description: >-
          What the tarballs are named after: hale-<name>-<target>.tar.gz
          (a `/` in it becomes `-`). release.yml passes the ref name
          (the tag), nightly.yml the nightly's tag.
        type: string
        required: true
      version:
        description: >-
          The version the binary reports (`hale --version`), written into
          Cargo.toml's [workspace.package] before the build. Empty keeps
          Cargo.toml's, as a release does.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            llvm-prefix: /usr/lib/llvm-18
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            llvm-prefix: /usr/lib/llvm-18
          - os: macos-15
            target: aarch64-apple-darwin
            llvm-prefix: /opt/homebrew/opt/llvm@18
    steps:
      - uses: actions/checkout@v4

      # A nightly reports its own version (scripts/nightly.sh `version`):
      # every reader of the version (`hale --version`, the lock's
      # `[dna] toolchain`, the image a habitat pulls) takes it from the
      # one CARGO_PKG_VERSION, so the build sets it where cargo reads it.
      - name: Set the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/nightly.sh set-version "$VERSION"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # LLVM version is baked into the cache key — bumping
          # `LLVM_SYS_180_PREFIX` to a different major needs a new
          # cache, since llvm-sys rebuilds against the new ABI.
          key: cargo-${{ matrix.target }}-llvm18-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ matrix.target }}-llvm18-

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          # the runners' resolver stopped answering for Ubuntu's archive
          # (2026-11-11): fetch from archive.ubuntu.com at an address a public
          # resolver gives (a known one if it gives none), retrying a failed download
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$f" ]; then sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#; s#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#' "$f"; fi
          done
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          # some of the archive's addresses answered with indexes that lack
          # the LLVM packages: each try pins the next address
          ips=$(dig +short +time=3 +tries=2 @1.1.1.1 archive.ubuntu.com A 2>/dev/null | grep -E '^[0-9.]+$' || true)
          ok=
          for ip in $ips 185.125.190.81 91.189.91.82 185.125.190.83; do
            sudo sed -i '/ archive\.ubuntu\.com security\.ubuntu\.com$/d' /etc/hosts
            echo "$ip archive.ubuntu.com security.ubuntu.com" | sudo tee -a /etc/hosts >/dev/null
            # packages.microsoft.com answers 403 at times and fails the whole update;
            # nothing these jobs install comes from it
            sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
            if sudo apt-get update && sudo apt-get install -y \
              llvm-18-dev libpolly-18-dev libzstd-dev \
              clang-18 libclang-18-dev zlib1g-dev; then ok=1; break; fi
          done
          [ -n "$ok" ]

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        # No `brew update`, and no auto-update inside `install`: the
        # runner image's formula revisions are the ones its bottles
        # exist for. v0.24.0's `brew update` moved cmake, python and
        # llvm@18 past them, and the tag's macOS build compiled LLVM
        # from source for hours (2026-10-16). macos.yml installs the
        # same way and takes seconds.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          set -eux
          # llvm@18 transitively brings zstd, but we install zstd
          # explicitly to guard against the formula's deps shifting.
          brew install llvm@18 zstd

      - name: Build release binary
        env:
          LLVM_SYS_180_PREFIX: ${{ matrix.llvm-prefix }}
        run: |
          set -eux
          # --workspace (not --bin hale) so libhale_ts_shim.a is also
          # built — codegen needs it beside the binary to link programs.
          cargo build --release --workspace

      - name: Vendor libunwind (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          # GH #231: the binary links Homebrew llvm@18's
          # libunwind.1.dylib; without Homebrew llvm@18 installed
          # it crashes at launch. Vendor the dylib beside the
          # binary and rewrite the load command to
          # @executable_path so the tarball is self-contained
          # (the .dylib ships in the archive next to `hale`).
          BIN=target/release/hale
          # Vendor EVERY non-system dylib (libunwind, libzstd, and
          # anything the formulas grow next), then fix the vendored
          # dylibs' own load commands + install ids. Two passes over
          # the dylib set handles dylib-to-dylib references.
          vendor_dir="$(dirname "$BIN")"
          for pass in 1 2; do
            for f in "$BIN" "$vendor_dir"/*.dylib; do
              [ -e "$f" ] || continue
              for LIB in $(otool -L "$f" | awk '/\/opt\/homebrew|\/usr\/local\/Cellar/ {print $1}'); do
                base="$(basename "$LIB")"
                [ -e "$vendor_dir/$base" ] || cp "$LIB" "$vendor_dir/$base"
                install_name_tool -change "$LIB" "@executable_path/$base" "$f"
              done
            done
          done
          for d in "$vendor_dir"/*.dylib; do
            [ -e "$d" ] || continue
            install_name_tool -id "@executable_path/$(basename "$d")" "$d"
            codesign --force --sign - "$d"
          done
          codesign --force --sign - "$BIN"
          # Audit: nothing outside /usr/lib + @executable_path may
          # remain across the binary AND the vendored dylibs.
          for f in "$BIN" "$vendor_dir"/*.dylib; do
            [ -e "$f" ] || continue
            if otool -L "$f" | grep -E "/opt/homebrew|/usr/local/Cellar"; then
              echo "non-system dylib dependency survived in $f" >&2
              exit 1
            fi
          done

      - name: Smoke-test the binary
        run: |
          set -eux
          # If the binary built but is somehow broken, fail loud
          # before uploading. `--help` exits non-zero in our CLI
          # (usage-on-stderr convention) so we just verify the
          # binary runs at all.
          ./target/release/hale || true
          file ./target/release/hale

      - name: The binary reports the version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eux
          first="$(./target/release/hale --version | head -n 1)"
          [ "$first" = "hale $VERSION" ]

      - name: Package binary
        id: package
        env:
          NAME: ${{ inputs.name }}
        run: |
          set -eux
          mkdir -p dist
          # A dispatched smoke run on a branch names its tarball after
          # the branch: `/` would make it a path (`ci/…` fails to open).
          ref="${NAME//\//-}"
          tarball="hale-${ref}-${{ matrix.target }}.tar.gz"
          # Include LICENSE + README alongside the binary; both
          # become first-class in the user-visible tarball.
          cp target/release/hale dist/
          # libhale_ts_shim.a MUST ship beside the binary: codegen
          # path-probes $(dirname current_exe)/libhale_ts_shim.a to link
          # any program using std::io. Omitting it (the pre-2026-07 bug)
          # shipped tarballs that could not build real programs.
          cp target/release/libhale_ts_shim.a dist/
          # GH #231: the vendored libunwind (macOS only — see the
          # Vendor step) rides beside the binary; the rewritten
          # @executable_path load command finds it there.
          cp -v target/release/*.dylib dist/ 2>/dev/null || true
          cp -v README.md dist/ 2>/dev/null || true
          cp -v LICENSE-MIT dist/ 2>/dev/null || true
          cp -v LICENSE-APACHE dist/ 2>/dev/null || true
          tar -czf "$tarball" -C dist .
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$tarball" | tee "$tarball.sha256"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: hale-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.tarball }}
            ${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error
