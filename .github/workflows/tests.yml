name: tests

# Runs the workspace test suite on every pull request targeting
# main and on every push to main. A pull request runs the DNA and
# face jobs only when its diff can reach DNA (`scope.dna`, from
# scripts/ci-scope.sh); the merge group runs every job, and a push to
# main runs the DNA and face jobs whatever its diff, so a stack is
# tested as the combination it becomes. Linux-only at v1; the macos
# workflow and the release workflow cover macOS.
#
# Uses cargo-nextest (drop-in replacement for `cargo test`) for
# smarter scheduling: each test runs in its own process.
# Workspace-wide test time drops ~2-3x vs libtest.
#
# NB: an earlier version of this comment claimed process-per-test
# was what made the shared `/tmp/lotus_test_*` paths safe. That was
# wrong — process isolation is not filesystem isolation, and two
# processes writing one path are MORE concurrent than two threads,
# not less. The suite passed because the `name` arguments happened
# not to overlap; nothing enforced it. Uniqueness now comes from
# `harness::unique_bin` (pid + counter), enforced by
# `harness_paths_are_unique.rs`.
#
# Build-once shape (2026-10-12): three build jobs compile the test
# binaries once each (`quick-build`, `build-cli`, `build-codegen`) and
# hand them over as nextest archives (`cargo nextest archive`, carrying
# `hale`, the build scripts' OUT_DIRs and the extra paths the `archive`
# profile in .config/nextest.toml names); each test job downloads its
# family's archive, extracts it in place and runs its slice without
# compiling anything. Until then every partition built the workspace and
# its family's test binaries for itself (2-7 min a job), so a family
# could only be split further by paying its build again; 2026-09-20 had
# measured a single archive at 1.1GB and judged the hand-off not worth
# it. With libLLVM linked dynamically the cli+dna archive is ~360MB and
# uploads in seconds, and a test job's setup is 30-90 s.

# One run per commit. A push to a PR branch used to trigger this
# twice — once as `push` (every branch) and once as `pull_request`
# — in two concurrency groups, so neither cancelled the other:
# 140 of 140 pull_request runs over 2026-09-18..20 had a twin push
# run on the same SHA. Push runs are for main only now; a branch
# gets its run through its PR.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests the combination a stack becomes, with
  # every job: the scope outputs are forced true on this event.
  merge_group:
  workflow_dispatch:

# Cancel an in-flight run on the same branch when a new push lands;
# tests on the older commit are already stale.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # the CI images are pulled from the repository's own mirror on ghcr.io
  # (mirror-images.yml), not anonymously from Docker Hub
  packages: read

env:
  LLVM_SYS_180_PREFIX: /usr/lib/llvm-18
  # sccache in front of rustc, backed by the Actions cache. rust-cache
  # (below) keeps dependency artifacts, but the workspace crates and
  # all ~565 test crates recompile on every commit — 2.6-4.2min of
  # each partition on 2026-09-20 — even when the commit touched no
  # Rust at all. sccache keys each rustc invocation on its inputs, so
  # a .hl-only or docs-only change compiles almost nothing, and a
  # compiler change recompiles only the crates downstream of it.
  # Linking is not cached; that is what the dynamic libLLVM is for.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  # The Actions cache answering 503 ServerBusy ("Egress is over the
  # account limit") failed a face job in `cargo build`: sccache could not
  # start its server and then failed `rustc -vV`. This covers server IO
  # errors after it is up; a server that cannot START on the backend is
  # the `sccache health` step's, after each install below.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  # How a test job runs the `build` job's nextest archive once it is
  # extracted in place (`Extract the test archive in place`): from the
  # archive's own metadata, so nextest neither builds nor extracts again.
  NEXTEST_ARCHIVE: >-
    --binaries-metadata target/nextest/binaries-metadata.json
    --cargo-metadata target/nextest/cargo-metadata.json
    --workspace-remap . --target-dir-remap target

jobs:
  # Which jobs this diff can possibly affect.
  #
  # NOT a markdown filter. Prose is genuinely tested here: every
  # ```hale block under `docs/src` must parse (`docs_snippets`), every
  # snippet in `spec/styleguide.md` must compile
  # (`styleguide_snippets`), and `hale-cli/build.rs` embeds `spec/*.md`
  # into the binary for `hale mcp`. A docs change is a code change to
  # those, and the partitions below always run.
  #
  # What prose cannot reach is the SUBSTRATE: the C runtime the
  # sanitizers exercise and the hand-transcribed models GenMC checks.
  # No sentence in a `.md` alters a memory ordering. Those three jobs
  # are ~20 CI-minutes that a prose-only change spends on nothing.
  #
  # Fails SAFE: anything it cannot classify — a new-branch push with no
  # `before` sha, a diff it cannot compute — runs everything.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      substrate: ${{ steps.classify.outputs.substrate }}
      # The same verdict under the name the test partitions read it
      # by: a prose-only diff runs `quick` and `docs` (below) and
      # skips the six partitions. Prose IS tested — every ```hale
      # block under docs/src must parse, every styleguide snippet
      # must typecheck, `hale mcp` serves the embedded spec — but
      # those tests live in hale-syntax, hale-types and one hale-cli
      # binary, and `quick` + `docs` run exactly those.
      code: ${{ steps.classify.outputs.substrate }}
      # Whether the diff can reach what the DNA and face jobs run
      # (scripts/ci-scope.sh lists the paths). Those jobs run on a
      # pull request only when this is true.
      dna: ${{ steps.classify.outputs.dna }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: classify
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            echo "merge group: every job runs"
            { echo "substrate=true"; echo "dna=true"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          # The first push of a NEW branch has no `before` sha — it is all
          # zeros — so the classifier had nothing to diff against and every
          # new branch paid the full substrate suite on its first push, even
          # for one line of prose. That is not genuinely unclassifiable: the
          # branch's diff against the default branch is exactly what its own
          # pull_request run computes a moment later, and the two disagreeing
          # is how this was noticed (one run skipped the three jobs, the
          # other ran them, same commit).
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            default="origin/${{ github.event.repository.default_branch }}"
            base="$(git merge-base "$default" HEAD 2>/dev/null || true)"
            [ -n "$base" ] && echo "no before-sha; using merge-base with $default: $base"
          fi
          # scripts/ci-scope.sh does the classifying (run it by hand:
          # `scripts/ci-scope.sh <base> HEAD`); an unusable base or an
          # empty diff comes back as everything-true.
          verdict="$(bash scripts/ci-scope.sh "$base" HEAD)"
          echo "$verdict"
          if printf '%s\n' "$verdict" | grep -qx 'prose=true'; then
            echo "prose-only diff, skipping sanitizer + model-checker jobs"
            echo "substrate=false" >> "$GITHUB_OUTPUT"
          else
            echo "substrate=true" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$verdict" | grep '^dna=' >> "$GITHUB_OUTPUT"

  # The fast lane: everything that needs no LLVM. hale-syntax,
  # hale-types, hale-model, hale-graph, hale-stdlib and hale-corpus have
  # no dependency on inkwell, so these jobs skip the LLVM install and the
  # codegen build entirely. They run on every diff, prose included.
  #
  # `quick-build` compiles their ~180 test binaries (about six minutes:
  # each is a bin crate, which sccache cannot cache) and archives them;
  # the six `quick` jobs run a hash sixth each of their ~2,500 tests
  # (about 2,150 test-seconds; the ten corpus sweeps of hale-types take
  # 60-260 s each, and three of them on one four-core runner made a part
  # of four run 5.5 minutes). One job building and running all of it was
  # the workflow's longest, at 16 minutes (2026-10-12).
  quick-build:
    name: quick build (LLVM-free test archive)
    runs-on: ubuntu-latest
    env:
      ARCHIVE: nextest-quick
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      # A cache outage must cost a cache miss, not the job: if sccache
      # cannot start on the GitHub cache backend (503 ServerBusy, GH
      # egress over the account limit), this job builds on sccache's
      # local disk instead. SCCACHE_IGNORE_SERVER_IO_ERROR (above) does
      # not cover a server that never starts (checked against
      # sccache 0.18.0 with a 503 stub).
      - &sccache-health
        name: sccache health
        run: |
          if ! sccache --start-server; then
            echo "::warning::sccache's GitHub cache backend is unavailable; this job builds without it"
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          fi

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quick-x86_64-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest archive (LLVM-free crates)
        run: |
          cargo nextest archive --release \
            -p hale-syntax -p hale-types -p hale-model -p hale-graph \
            -p hale-stdlib -p hale-corpus \
            --archive-file "$RUNNER_TEMP/nextest.tar.zst"
          ls -l "$RUNNER_TEMP/nextest.tar.zst"

      - &archive-upload
        name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}/nextest.tar.zst
          # already zstd
          compression-level: 0
          retention-days: 1

  quick:
    name: quick ${{ matrix.part }}/6 (parse, typecheck, model)
    needs: quick-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5, 6]
    env:
      ARCHIVE: nextest-quick
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - &install-nextest
        name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # A test job runs a build job's nextest archive (`env.ARCHIVE`
      # names which). The test binaries bake absolute paths in at compile
      # time (CARGO_MANIFEST_DIR, CARGO_TARGET_TMPDIR, CARGO_BIN_EXE_hale,
      # and hale-codegen's probe for the shim staticlib), and every hosted
      # runner checks out to the same path, so the archive is extracted
      # in place: `target/` lands where the build job's was, and those
      # paths hold here as they held there.
      - &archive-download
        name: Download the test archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ runner.temp }}

      - &archive-extract
        name: Extract the test archive in place
        # Into the checkout itself, then run with the archive's metadata
        # ($NEXTEST_ARCHIVE) rather than `--archive-file`, which would
        # extract it a second time. The archive file stays outside the
        # checkout (the clean-tree step). `target/tmp` is
        # CARGO_TARGET_TMPDIR, which cargo creates at build time and the
        # archive does not carry.
        run: |
          set -eux
          tar --zstd -xf "$RUNNER_TEMP/nextest.tar.zst"
          rm "$RUNNER_TEMP/nextest.tar.zst"
          mkdir -p target/tmp
          du -sh target

      - name: cargo nextest run (LLVM-free crates, part ${{ matrix.part }}/6)
        run: cargo nextest run $NEXTEST_ARCHIVE --partition hash:${{ matrix.part }}/6

  # A prose-only diff's only remaining exposure after `quick`: the
  # `hale mcp` docs-search serves spec/*.md embedded at build time
  # (hale-cli/build.rs), and its test asserts on that text. One
  # binary, so one job, instead of six partitions.
  docs:
    name: docs (embedded spec)
    needs: scope
    if: github.event_name == 'merge_group' || needs.scope.outputs.code != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - *sccache-health

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: false

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: cargo nextest run (hale mcp over the embedded spec)
        run: |
          cargo nextest run --release \
            -p hale-cli --test mcp \
            --features hale-codegen/dynamic-llvm

  # The partitions are by BINARY SET, not by test-name hash. Every
  # file under a crate's tests/ is its own test binary — 565 across
  # the workspace — and a hash partition over test names needs nearly
  # all of them, so each of six partitions spent ~4min compiling and
  # linking the whole set to run a sixth of it (2026-09-20, and
  # sccache cannot help: it caches rlibs, never bin/test crate
  # types). Three job families instead, each building only what it
  # runs: `cli` (hale-cli and the crates beside it, minus the DNA
  # fixture suite), `codegen` (hale-codegen's tests, now ~45 area
  # binaries), and `dna` (the fixture suite on
  # its own, so its slices can run two-wide on five runners). The
  # LLVM-free crates are `quick`'s.
  #
  # Built once (2026-10-12): two build jobs compile the workspace and the
  # test binaries of the families that wait on them, and hand those over
  # as a nextest archive; each test job extracts it in place and runs its
  # slice with no compiler at all, so a family splits into as many jobs
  # as its test minutes want for the cost of a runner's setup, not of
  # another build. Two build jobs rather than one so that neither family
  # waits on the other's compile: `build-cli` (hale-cli, hale-lsp,
  # hale-iris, hale-dna, hale-frontend, hale-ts-shim; ~1.5 min of test
  # binaries) feeds `cli` and `dna`, `build-codegen` (hale-codegen's ~45
  # area binaries, ~4.5 min) feeds `codegen`.
  build-cli:
    name: build (cli + dna test archive)
    needs: scope
    if: needs.scope.outputs.code == 'true' || github.event_name != 'pull_request' || needs.scope.outputs.dna == 'true'
    runs-on: ubuntu-latest
    env:
      ARCHIVE: nextest-cli
      # What this job archives: the workspace less the LLVM-free crates
      # (`quick-build`'s) and hale-codegen (`build-codegen`'s).
      ARCHIVE_SCOPE: >-
        --workspace
        --exclude hale-syntax --exclude hale-types --exclude hale-model
        --exclude hale-graph --exclude hale-stdlib --exclude hale-corpus
        --exclude hale-codegen
    steps:
      - &build-checkout
        uses: actions/checkout@v4

      - &build-toolchain
        name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - &build-sccache
        name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - *sccache-health

      # rust-cache keeps only the dependency artifacts (the workspace
      # crates and their test binaries change on every commit), so it
      # restores in seconds. Saved from main only, so a PR's cache writes
      # cannot evict the one every other branch restores.
      - &build-rust-cache
        name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - &build-llvm
        name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - &build-nextest
        name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - &build-workspace
        name: cargo build --release --workspace
        # Every workspace member, so `libhale_ts_shim.a` is built: codegen
        # finds it by path-probe beside the compiler (no Cargo dependency
        # can name a staticlib), and the archive carries it from there
        # (`--profile archive` in .config/nextest.toml).
        # `--features hale-codegen/dynamic-llvm` links the shared libLLVM,
        # so the archive is a few hundred MB, not ~100MB per test binary.
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - &build-archive
        name: cargo nextest archive
        # The test binaries, the binaries they run (`hale`, through
        # CARGO_BIN_EXE_hale), the build scripts' OUT_DIRs, and the two
        # extra paths the `archive` profile names.
        run: |
          cargo nextest archive --release --profile archive $ARCHIVE_SCOPE \
            --features hale-codegen/dynamic-llvm \
            --archive-file "$RUNNER_TEMP/nextest.tar.zst"
          ls -l "$RUNNER_TEMP/nextest.tar.zst"

      - *archive-upload

      - &build-sccache-stats
        name: sccache stats
        if: always()
        run: sccache --show-stats

  build-codegen:
    name: build (codegen test archive)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      ARCHIVE: nextest-codegen
      ARCHIVE_SCOPE: -p hale-codegen
    steps:
      - *build-checkout
      - *build-toolchain
      - *build-sccache
      - *sccache-health
      - *build-rust-cache
      - *build-llvm
      - *build-nextest
      - *build-workspace
      - *build-archive
      - *archive-upload
      - *build-sccache-stats

  cli:
    name: cli ${{ matrix.part }}/5
    needs: [scope, build-cli]
    if: needs.scope.outputs.code == 'true'
    # Free runners only: a paid 8-core runner was tried on 2026-09-26 and
    # cost about $200 a day; test time is cut at the cause instead.
    runs-on: ubuntu-latest
    strategy:
      # Don't short-circuit other partitions on first failure —
      # we want to see the full failure picture across the suite.
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    # GH #583 K1: the knowledge store's Postgres half runs against a
    # service container; `dna/tests/knowledge_store_test.hl` reads the
    # DSN and skips the half when it is unset (a laptop without one).
    services:
      knowledge-db:
        image: ghcr.io/hale-lang/ci-pgvector:pg16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: dna
          POSTGRES_PASSWORD: dna
          POSTGRES_DB: dna
        ports:
          - 5480:5432
        options: >-
          --health-cmd "pg_isready -U dna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHIVE: nextest-cli
      HALE_DNA_MEMORY_DSN_OWNER: postgres://dna:dna@127.0.0.1:5480/dna?sslmode=disable
      HALE_DNA_NATS_URL_OWNER: nats://127.0.0.1:4222
      # The DNA tests push to bare remotes under /tmp and clone from them
      # moments later. git's automatic gc after a receive detaches and
      # can prune a loose object while the clone is still copying it
      # ("failed to copy file to ... objects/..: No such file or
      # directory", a flake on #671). No test repo needs gc.
      GIT_CONFIG_COUNT: "3"
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: "0"
      GIT_CONFIG_KEY_1: receive.autogc
      GIT_CONFIG_VALUE_1: "false"
      # git also runs `maintenance --auto` after commits and fetches: its
      # maintenance.lock in a test repository has failed a clone copying it
      GIT_CONFIG_KEY_2: maintenance.auto
      GIT_CONFIG_VALUE_2: "false"
    steps:
      - uses: actions/checkout@v4

      # GH #986: the nerves — NATS with JetStream, beside memory's
      # Postgres. A step, not a service: a service container cannot be
      # given the server's `-js` flag.
      # The images the tests start (here, and through `hale dna dev`'s
      # compose) come from the mirror and are tagged with their Docker Hub
      # names, so nothing pulls anonymously from Docker Hub (rate-limited).
      - name: Pull the CI images from the mirror
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for pair in ci-pgvector:pg16=pgvector/pgvector:pg16 ci-nats:2=nats:2 ci-prometheus:v3.5.0=prom/prometheus:v3.5.0; do
            docker pull "ghcr.io/hale-lang/${pair%%=*}"
            docker tag "ghcr.io/hale-lang/${pair%%=*}" "${pair#*=}"
          done
      - name: Start NATS (JetStream)
        run: docker run -d --name nerves -p 127.0.0.1:4222:4222 nats:2 -js

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - &install-llvm-runtime
        name: Install LLVM 18 + clang + wasm-ld
        # libLLVM-18.so: the test binaries and `hale` link it dynamically
        # (`hale-codegen/dynamic-llvm`). clang-18 links compiled `.hl`
        # fixtures at test time, and lld-18's wasm-ld the wasm32 ones
        # (`hale build --target wasm32`).
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev lld-18 zlib1g-dev

      - *install-nextest
      - *archive-download
      - *archive-extract

      - name: hale fmt --check (canonical-form gate)
        # The styleguide's §5 fmt tier: the repo's own .hl surface
        # must be canonical. Partition 1 only — the check is
        # whole-repo and takes <1s; running it 3× adds nothing.
        if: matrix.part == 1
        run: |
          # Whole repo, not an enumerated list. The list form silently
          # excluded tests/hale (the in-language suite), which drifted
          # out of canonical form unnoticed — an enumerated scope is a
          # scope that goes stale every time a directory is added.
          ./target/release/hale fmt --check .

      # The compiler's identity and the host's, for the toolchain cache
      # below and the face's builds cache in face-browser. A cached output
      # is only as good as the compiler that made it: the toolchain cache's
      # own directory name (`iris/<hash>`) hashes the version, the embedded
      # DNA, iris and stdlib sources and the compiler's own source (front
      # end, type checker, codegen and the runtime C), but not the C
      # compiler, rustc or the registry crates, and a binary already there
      # is exec'd without a staleness check, so a change to one of those
      # that left the key alone would run binaries the old toolchain built.
      #
      # `id` is what the compiler binary was built from, as cargo itself
      # records it: every local file in `target/release/hale.d` (each
      # crate's sources, the runtime C, and everything the binary embeds
      # through include_str!: dna/, iris/, spec/, the stdlib), with its
      # content, plus Cargo.lock for the registry crates and `rustc -vV`.
      # That is exactly the set cargo rebuilds `hale` on, so any compiler
      # change misses. Not the binary's own bytes: they differ between two
      # builds of one tree (measured on this PR's two runs), not least
      # because hale-cli's build.rs frames the git commit into
      # HALE_TOOLCHAIN_SHA256, so a key on them would never hit. The
      # commit is the one input left out on purpose; what a hit reuses
      # differs from a fresh build only in the commit its execution
      # identity names. The id also carries what the compiler calls at
      # build time without carrying it: `clang` (the runtime TUs and the
      # link) and libLLVM (linked dynamically).
      #
      # `host` is the runner image and the CPU. `hale build` tunes for the
      # machine it runs on (`-march=native`, and the runtime object cache
      # assumes it is never shared across machines), and hosted runners
      # are not all one CPU model, so a binary built on one could stop
      # with SIGILL on another. The CPU is what clang resolves `native`
      # to, which is what LLVM tunes the Hale code for too. (The face's
      # builds cache uses `image` alone: face-browser builds those three
      # for a fixed baseline CPU instead.)
      #
      # Anchored here and reused (`*compiler-identity`) by dna, face-api
      # and face-browser, so every job computes the key the same way.
      - &compiler-identity
        name: Compiler identity (the caches' key)
        id: compiler
        run: |
          set -euo pipefail
          inputs=$(python3 - target/release/hale.d <<'PY'
          import hashlib, os, re, subprocess, sys
          root = os.getcwd()
          deps = set()
          for line in open(sys.argv[1]).read().replace("\\\n", " ").splitlines():
              if ": " in line:
                  for p in re.split(r"(?<!\\) +", line.split(": ", 1)[1].strip()):
                      if p:
                          deps.add(os.path.realpath(p.replace("\\ ", " ")))
          files = set()
          for p in deps:
              if os.path.isdir(p):
                  files.update(os.path.join(d, f) for d, _, fs in os.walk(p) for f in fs)
              else:
                  files.add(p)
          h = hashlib.sha256()
          for p in sorted(files):
              rel = os.path.relpath(p, root)
              if rel.startswith("target/"):
                  rel = "target/.../" + os.path.basename(p)  # an OUT_DIR file; its dir name is a cargo hash
              body = open(p, "rb").read() if os.path.isfile(p) else b"(missing)"
              h.update(rel.encode() + b"\0" + hashlib.sha256(body).digest())
          h.update(open("Cargo.lock", "rb").read())
          h.update(subprocess.run(["rustc", "-vV"], capture_output=True, check=True).stdout)
          print(h.hexdigest(), len(files))
          PY
          )
          read -r src nfiles <<< "$inputs"
          tools="$(clang --version | head -1); $(dpkg-query -W -f='${Package} ${Version}' libllvm18)"
          id=$(printf '%s\n%s\n' "$src" "$tools" | sha256sum | cut -c1-32)
          cpu=$(clang -march=native -### -c -x c /dev/null 2>&1 \
            | grep -oE '"-target-(cpu|feature)" "[^"]*"' | tr '\n' ' ')
          host=$(printf '%s\n%s\n' "${ImageOS:-unknown}" "$cpu" | sha256sum | cut -c1-16)
          echo "compiler: $nfiles input files, sources $src; $tools; id $id"
          echo "host: ${ImageOS:-unknown}, $(echo "$cpu" | grep -oE '"-target-cpu" "[^"]*"'); host $host"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          # The toolchain cache's key (below), here so every job spells it
          # once: the compiler, the host, and the warm script.
          warm=$(sha256sum scripts/warm-dna-cache.sh | cut -c1-16)
          echo "toolchain=$RUNNER_OS-$id-$host-$warm" >> "$GITHUB_OUTPUT"

      # The toolchain cache the warm step fills: `~/.cache/hale` (nothing
      # here sets XDG_CACHE_HOME), which holds `iris/<hash>/` (the embedded
      # DNA and iris sources materialized, with the host, the observer and
      # the knowledge service built beside them)
      # and the runtime object cache, `runtime/`. Everything in it is built
      # from what the compiler binary embeds, so the compiler id and the
      # host cover its inputs: the checkout's dna/ and iris/ are not read
      # as such (an edit to an embedded file is in hale.d, so it changes
      # the id), and keying on the whole trees would only miss on every
      # test or face change. The warm script is in the key because it
      # decides what gets built.
      #
      # On a hit the warm step still runs. It is idempotent (each build is
      # skipped when its binary is there) and it recreates what is per run:
      # the scratch project, the knowledge probe, and the
      # `hale-tests-iris-cache` symlink, which is not cached. Nothing per
      # run lives in the directory: `.build.lock` is only an flock target,
      # and materialization's pid-named temp files are renamed into place
      # before it returns.
      - &toolchain-restore
        name: Restore the DNA toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/hale
          key: dna-toolchain-${{ steps.compiler.outputs.toolchain }}

      - name: Warm the DNA toolchain cache
        # The first host verb of this binary builds the host into the
        # cache: paid once here, not inside a test's own deadline beside
        # the partition's other organisms on a loaded runner.
        env:
          HALE_DNA_DISCOVER: "off"
        run: scripts/warm-dna-cache.sh ./target/release/hale

      # Saved straight after the warm, not at the end of the job, so the
      # entry holds what the warm built and nothing the tests left behind.
      # The cli and dna jobs save this entry; the face jobs, whose warm
      # skips the observer, save theirs under another name (see face-api),
      # so a partition never restores a cache without the observer. The
      # savers of one key race; the losers log that it exists and carry on.
      - &toolchain-save
        name: Save the DNA toolchain cache
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/hale
          key: ${{ steps.toolchain-cache.outputs.cache-primary-key }}

      - name: cargo nextest run (cli part ${{ matrix.part }}/5)
        # Everything the other families do not own: hale-cli's
        # binaries less the DNA fixture suite (which the archive also
        # holds, for the `dna` jobs), plus hale-lsp, hale-iris, hale-dna,
        # hale-frontend and hale-ts-shim. `count:I/N` deals the sorted
        # test list out round-robin, so one binary's tests spread over
        # every part: `hash:` piled the heavy hale-cli DNA binaries onto
        # one part of five (1,250 of 3,500 test-seconds, against 520-860
        # for each part dealt by count; 2026-10-12). A test's part is
        # fixed for a given test list.
        run: |
          cargo nextest run $NEXTEST_ARCHIVE \
            -E 'not binary(dna_native_suite)' \
            --partition count:${{ matrix.part }}/5

  codegen:
    name: codegen ${{ matrix.part }}/5
    needs: [scope, build-codegen]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    env:
      ARCHIVE: nextest-codegen
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # lld-18 for wasm-ld: the wasm32 builds (the lowering shadow, the
      # teardown spines per target, the portable subset) link with it,
      # and skip, naming it, when it is missing.
      - *install-llvm-runtime

      # node runs the wasm32 modules (the portable subset compares their
      # stdout with the native binaries'); stated, not assumed of the
      # runner image.
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - *install-nextest
      - *archive-download
      - *archive-extract

      - name: cargo nextest run (hale-codegen tests, part ${{ matrix.part }}/5)
        # The crate's test files are built as ~40 area binaries (each
        # `tests/<area>.rs` names its files with `#[path]`; see
        # `every_test_file_is_built`), where they were 352 binaries and
        # this step named half of them with `--test`. nextest deals the
        # TESTS between the parts by hash, the lib's unit tests included
        # (about 3,450 test-seconds in all, none longer than ~85 s).
        run: cargo nextest run $NEXTEST_ARCHIVE --partition hash:${{ matrix.part }}/5

  dna:
    name: dna ${{ matrix.part }}/5
    needs: [scope, build-cli]
    if: github.event_name != 'pull_request' || needs.scope.outputs.dna == 'true'
    # Free runners only: a paid 8-core runner was tried on 2026-09-26 and
    # cost about $200 a day; test time is cut at the cause instead.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4, 5]
    services:
      knowledge-db:
        image: ghcr.io/hale-lang/ci-pgvector:pg16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: dna
          POSTGRES_PASSWORD: dna
          POSTGRES_DB: dna
        ports:
          - 5480:5432
        options: >-
          --health-cmd "pg_isready -U dna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCHIVE: nextest-cli
      HALE_DNA_MEMORY_DSN_OWNER: postgres://dna:dna@127.0.0.1:5480/dna?sslmode=disable
      HALE_DNA_NATS_URL_OWNER: nats://127.0.0.1:4222
      GIT_CONFIG_COUNT: "3"
      GIT_CONFIG_KEY_0: gc.auto
      GIT_CONFIG_VALUE_0: "0"
      GIT_CONFIG_KEY_1: receive.autogc
      GIT_CONFIG_VALUE_1: "false"
      # git also runs `maintenance --auto` after commits and fetches: its
      # maintenance.lock in a test repository has failed a clone copying it
      GIT_CONFIG_KEY_2: maintenance.auto
      GIT_CONFIG_VALUE_2: "false"
    steps:
      - uses: actions/checkout@v4

      # GH #986: the nerves — NATS with JetStream, beside memory's
      # Postgres. A step, not a service: a service container cannot be
      # given the server's `-js` flag.
      # The images the tests start (here, and through `hale dna dev`'s
      # compose) come from the mirror and are tagged with their Docker Hub
      # names, so nothing pulls anonymously from Docker Hub (rate-limited).
      - name: Pull the CI images from the mirror
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for pair in ci-pgvector:pg16=pgvector/pgvector:pg16 ci-nats:2=nats:2 ci-prometheus:v3.5.0=prom/prometheus:v3.5.0; do
            docker pull "ghcr.io/hale-lang/${pair%%=*}"
            docker tag "ghcr.io/hale-lang/${pair%%=*}" "${pair#*=}"
          done
      - name: Start NATS (JetStream)
        run: docker run -d --name nerves -p 127.0.0.1:4222:4222 nats:2 -js

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The fixtures run through the archive's `hale`.
      - *install-llvm-runtime
      - *install-nextest
      - *archive-download
      - *archive-extract

      # The compiler id and the toolchain cache, as in the cli job.
      - *compiler-identity
      - *toolchain-restore

      - name: Warm the DNA toolchain cache
        # The first host verb of this binary builds the host into the
        # cache: paid once here, not inside a test's own deadline beside
        # seven other organisms on a loaded runner.
        env:
          HALE_DNA_DISCOVER: "off"
        run: scripts/warm-dna-cache.sh ./target/release/hale

      - name: Warm the DNA fixture organisms' build cache
        # `Host::build_seed` caches dna/org and a project's app seed by
        # content fingerprint, shared across every organism with the
        # same sources — but with no job-scoped warm, four fixtures on
        # four parallel slice processes each raced a COLD cache on
        # their first organism, all paying the same ~4s build at once.
        # This starts one throwaway organism (no memory/nerves this
        # job did not already bring up for the slices) long enough for
        # both builds to land, so every fixture after it is a hit
        # instead of a miss.
        run: scripts/warm-dna-fixtures-cache.sh ./target/release/hale

      - *toolchain-save

      - name: cargo nextest run (DNA fixture suite, part ${{ matrix.part }}/5)
        # The suite alone on its runner: twenty slice tests split across
        # five jobs, four slices each, two at a time (`--profile small`,
        # the `dna-fixtures-small` group in .config/nextest.toml).
        # `count:` deals the alphabetical test list out round-robin, so
        # the split is the same every run, and the slice tests are named
        # `dna_fixtures_slice_<ii>` (zero-padded) so that list is slice
        # order: `HEAVY` in dna_native_suite.rs places the heavy fixtures
        # so the five parts' slice minutes come out level and each part
        # starts its longest slices first. Change the job count only
        # with HEAVY.
        env:
          # The free 4-core runner answers a proposal slower than the suite's
          # default wait (2) allows while four slices run beside each other;
          # macOS already runs at 3.
          HALE_DNA_WAIT_SCALE: "3"
        run: |
          cargo nextest run $NEXTEST_ARCHIVE \
            -E 'binary_id(hale-cli::dna_native_suite)' \
            --profile small \
            --partition count:${{ matrix.part }}/5

      - &tree-is-clean
        name: The run left the source tree as it found it
        # A build or a test that writes into the checkout (a binary beside
        # its seed, a scratch directory, a rewritten fixture) is a defect
        # this job only shows by listing it: `hale build -o` and the
        # per-run scratch directory exist so that nothing does. Ignored
        # files are not listed, and the only rule that ignores compiled
        # output is `target/`.
        run: |
          status=$(git status --porcelain --untracked-files=all)
          if [ -n "$status" ]; then
            echo "::error::the run wrote into the source tree:"
            echo "$status"
            exit 1
          fi

  # The face and the DNA service API (GH #690, #998), as two jobs with
  # no edge between them, so they run concurrently (GH #1009): the API
  # step is the long pole, and sequenced behind it the browser step
  # added its minutes to the workflow's wall time.
  #
  # face-api: the read contract's fixtures and validator, the API's own
  # native tests, the head's tests, and the shared query layer's
  # Git-record fixtures. face-browser: the face's browser cases
  # (dna/face) against the real API and head, which it builds itself
  # (the builds only; the contract tests stay in face-api). The face
  # has no observer, so neither job builds iris (fuse-hl). Their own
  # jobs, on the same build the dna partitions make, so their minutes
  # never sit on the critical path of a partition that is already the
  # longest.
  #
  # Each job builds the API and the head for itself rather than one
  # handing its builds to the other. A hand-off (an artifact, or a cache
  # entry saved mid-run) is a `needs` edge, and behind it the consumer
  # would wait out the producer's setup, compiler build and seed builds
  # before starting its own: minutes on the critical path, to save
  # builds that cost no wall time once they run beside the warm
  # (scripts/warm-and-build.sh). Across runs the browser shards do share
  # theirs, through the builds cache.
  face-api:
    name: face (DNA API + head)
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.dna == 'true'
    runs-on: ubuntu-latest
    # GH #985: the API's Knowledge tests migrate a record into this
    # Postgres with the owner's DSN and read it as the head; without it
    # they say so and exercise nothing.
    services:
      memory-db:
        image: ghcr.io/hale-lang/ci-pgvector:pg16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: dna
          POSTGRES_PASSWORD: dna
          POSTGRES_DB: dna
        ports:
          - 5480:5432
        options: >-
          --health-cmd "pg_isready -U dna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HALE_DNA_DISCOVER: "off"
      HALE_DNA_MEMORY_DSN_OWNER: postgres://dna:dna@127.0.0.1:5480/dna?sslmode=disable
      HALE_DNA_NATS_URL_OWNER: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@v4

      # GH #986: the nerves — NATS with JetStream, beside memory's
      # Postgres. A step, not a service: a service container cannot be
      # given the server's `-js` flag.
      # The images the tests start (here, and through `hale dna dev`'s
      # compose) come from the mirror and are tagged with their Docker Hub
      # names, so nothing pulls anonymously from Docker Hub (rate-limited).
      - name: Pull the CI images from the mirror
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for pair in ci-pgvector:pg16=pgvector/pgvector:pg16 ci-nats:2=nats:2 ci-prometheus:v3.5.0=prom/prometheus:v3.5.0; do
            docker pull "ghcr.io/hale-lang/${pair%%=*}"
            docker tag "ghcr.io/hale-lang/${pair%%=*}" "${pair#*=}"
          done
      - name: Start NATS (JetStream)
        run: docker run -d --name nerves -p 127.0.0.1:4222:4222 nats:2 -js

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - *sccache-health

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: cargo build --release --workspace
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      # The compiler id and the toolchain cache, as in the cli job. This
      # job's warm skips the observer, so it prefers the partitions' entry
      # (which has everything this job needs) and falls back to one of its
      # own, `dna-toolchain-no-observer-…`, which it saves only when it
      # restored neither. The two names differ right after
      # `dna-toolchain-`, so neither is a prefix of the other and a
      # partition can never restore the smaller one. Anchored here and
      # reused by face-browser.
      - *compiler-identity
      - &face-toolchain-restore
        name: Restore the DNA toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/hale
          key: dna-toolchain-${{ steps.compiler.outputs.toolchain }}
          restore-keys: dna-toolchain-no-observer-${{ steps.compiler.outputs.toolchain }}

      - name: Warm the DNA toolchain cache and build the DNA API and the head
        # The head fixtures create fresh projects with hale dna new under
        # their own budgets; the first host build of this binary is paid
        # once here, not inside one of them. Nothing here runs the
        # observer, so its build is skipped.
        #
        # The three seeds the tests below spawn are checked and built
        # (native, as a user builds them) beside the warm rather than
        # after it: each `hale build` is one single-threaded process, and
        # in turn the three took 12 of this job's 26 minutes on a
        # four-core runner (2026-09-26). The script waits for every build
        # and prints each one's output as its own group.
        env:
          HALE_DNA_DISCOVER: "off"
          HALE_WARM_SKIP_IRIS: "1"
        run: |
          scripts/warm-and-build.sh ./target/release/hale --check \
            dna/api dna/api/practice_review dna/api/project_service

      # Only when neither entry was there (`cache-matched-key` is empty on
      # a miss); after the warm, as in the cli job. The builds beside the
      # warm add their runtime objects to the entry: content-addressed by
      # source and flags, so a later build only finds them ready.
      - &face-toolchain-save
        name: Save the DNA toolchain cache
        if: steps.toolchain-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/hale
          key: dna-toolchain-no-observer-${{ steps.compiler.outputs.toolchain }}

      - name: DNA read API integration
        # The fixtures own their Git environment: no GIT_CONFIG_* here, and
        # the system config disabled, which definition_drafts_api_test asserts.
        env:
          GIT_CONFIG_NOSYSTEM: "1"
          GIT_CONFIG_GLOBAL: /dev/null
        run: |
          export HALE_BIN="$PWD/target/release/hale"
          # dna/api, practice_review and project_service were checked and
          # built beside the warm, above, into target/seeds.
          HALE_API_BIN="$PWD/target/seeds/api/api" \
            ./target/release/hale test dna/api/tests
          # The practice-review adapter over a stub provider: no service.
          ./target/release/hale test dna/api/practice_review/tests
          # The head (GH #965): its fixtures spawn the built head over
          # the plain API and exec this compiler's `hale dna` verbs detached.
          HALE_HEAD_BIN="$PWD/target/seeds/project_service/project_service" \
            HALE_API_BIN="$PWD/target/seeds/api/api" \
            ./target/release/hale test dna/api/project_service/tests
          # Domain fixtures own temporary Git roots and do not need a database.
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/target/release/hale" test "$GITHUB_WORKSPACE/dna/operations/tests")

      - *tree-is-clean

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # The browser suite in two balanced shards, about 315 s of Playwright
  # each (run 36371607135: 630 s in all, of which the startup spec is 96 s,
  # its first case being the one-command launcher building the head and its
  # API from a fresh checkout copy). Shard 1 is startup.spec plus the four
  # longest spec files that sit beside it; shard 2 is every other spec, so
  # a new spec file lands there (the step below has the pattern and the
  # measurements). It was `startup` alone against `rest`, and `rest` was
  # the longest job in the workflow at 665 s to 782 s, `startup` about
  # 270 s. A third shard would add a runner's setup, and the job count sits
  # at the free cap's edge. Both shards warm and build the same set and
  # restore as below. The builds cache is shard 2's to save. The toolchain
  # cache is shared, and its second saver logs that the entry exists and
  # carries on.
  face-browser:
    name: face (browser, ${{ matrix.shard }}/2)
    needs: scope
    if: github.event_name != 'pull_request' || needs.scope.outputs.dna == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    # GH #985: Knowledge lives in memory. The browser suite's Knowledge
    # fixture migrates its record into this Postgres with the owner's DSN
    # (set on the step that runs the suite, below) and hands the API the
    # head's DSN alone; its teardown drops the record's schema and roles.
    services:
      memory-db:
        image: ghcr.io/hale-lang/ci-pgvector:pg16
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: dna
          POSTGRES_PASSWORD: dna
          POSTGRES_DB: dna
        ports:
          - 5480:5432
        options: >-
          --health-cmd "pg_isready -U dna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HALE_DNA_DISCOVER: "off"
    steps:
      - uses: actions/checkout@v4

      # GH #986: the nerves — NATS with JetStream, beside memory's
      # Postgres. A step, not a service: a service container cannot be
      # given the server's `-js` flag.
      # The images the tests start (here, and through `hale dna dev`'s
      # compose) come from the mirror and are tagged with their Docker Hub
      # names, so nothing pulls anonymously from Docker Hub (rate-limited).
      - name: Pull the CI images from the mirror
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for pair in ci-pgvector:pg16=pgvector/pgvector:pg16 ci-nats:2=nats:2 ci-prometheus:v3.5.0=prom/prometheus:v3.5.0; do
            docker pull "ghcr.io/hale-lang/${pair%%=*}"
            docker tag "ghcr.io/hale-lang/${pair%%=*}" "${pair#*=}"
          done
      - name: Start NATS (JetStream)
        run: docker run -d --name nerves -p 127.0.0.1:4222:4222 nats:2 -js

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - *sccache-health

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: cargo build --release --workspace
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      # The compiler id and the toolchain cache, as in face-api.
      - *compiler-identity
      - *face-toolchain-restore

      # The three binaries the browser fixtures spawn, cached across runs.
      # A build is a function of the compiler, the machine it is tuned for
      # and the sources it reads. These three are built for the portable
      # x86-64-v3 baseline (`--target-cpu baseline`, below) instead of the
      # host, so the CPU the runner happens to draw is not an input: keyed
      # per host they almost never hit, because the runners of four runs
      # of this PR were znver3, znver4, graniterapids, sapphirerapids and
      # one LLVM 18 has no name for. The browser suite exercises what they
      # serve, not how fast; face-api still builds and tests them native.
      # So the key is the compiler id (see the cli job), the runner image,
      # and every file under dna/ and iris/: the seeds' imports, followed
      # transitively (`hale inputs` on each seed), reach
      # dna/{api,core,operations,organization_source,organization_runtime,ui}
      # and iris/process_identity and nothing outside those two trees. The
      # stdlib and the runtime are inside the compiler. The paths are the
      # three outputs only, each a directory under target/seeds (the
      # binary built there with `-o`, as scripts/warm-and-build.sh does).
      #
      # dna/api/practice_review is not among the cached three: nothing in
      # the browser suite reads HALE_NATIVE_HEAD_API (the startup case's
      # launcher builds its own), and face-api builds and tests it. Each
      # shard builds it beside them when it is missing, uncached: the
      # native command lanes (GH #1029) start it as their API
      # (HALE_NATIVE_COMMAND_API).
      - name: Restore the DNA API and the head
        id: face-builds
        uses: actions/cache/restore@v4
        with:
          path: |
            target/seeds/api
            target/seeds/project_service
            target/seeds/knowledge
          key: face-builds-${{ runner.os }}-${{ steps.compiler.outputs.image }}-${{ steps.compiler.outputs.id }}-x86-64-v3-${{ hashFiles('dna/**', 'iris/**') }}

      - name: Warm the DNA toolchain cache and build the DNA API and the head
        # The warm: the face's browser fixtures create fresh projects with
        # hale dna new under their own budgets; the first host build of
        # this binary is paid once here, not inside one of them. Nothing
        # here runs the observer, so its build is skipped.
        #
        # The builds: HALE_API_BIN, HALE_NATIVE_HEAD_BIN and the Knowledge
        # fixture (HALE_FACE_KNOWLEDGE_BIN, HALE_KNOWLEDGE_SEED_BIN) below.
        # face-api checks and tests the first two; this job only builds
        # them, beside the warm (each is one single-threaded process; in
        # turn, warm then builds took 17 minutes, 2026-09-26), and on a
        # cache hit not at all: it checks the restored three are there and
        # executable.
        #
        # Both shards run the same builds: shard 1 carries the startup
        # spec, whose first case builds its own head and API through the
        # launcher, but the other specs in it (and all of shard 2's) hand
        # the launcher the binaries built here.
        env:
          HALE_DNA_DISCOVER: "off"
          HALE_WARM_SKIP_IRIS: "1"
        run: |
          set -euo pipefail
          hit=${{ steps.face-builds.outputs.cache-hit == 'true' }}
          seeds=()
          [ "$hit" = true ] || seeds=(dna/api dna/api/project_service dna/api/tests/knowledge)
          # the native command lanes start the composed head (GH #1029)
          [ -x target/seeds/practice_review/practice_review ] || seeds+=(dna/api/practice_review)
          built=(target/seeds/api/api target/seeds/project_service/project_service
            target/seeds/knowledge/knowledge target/seeds/practice_review/practice_review)
          scripts/warm-and-build.sh ./target/release/hale --target-cpu baseline "${seeds[@]}"
          for b in "${built[@]}"; do
            if [ ! -f "$b" ] || [ ! -x "$b" ]; then
              echo "::error::$b is missing or not executable"; exit 1
            fi
          done

      - *face-toolchain-save

      # Saved under the key the restore computed, not a fresh hashFiles: it
      # is the same key either way now that the builds land in target/seeds
      # and not under dna/, but the save then cannot drift from the restore.
      - name: Save the DNA API and the head
        if: matrix.shard == '2' && steps.face-builds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/seeds/api
            target/seeds/project_service
            target/seeds/knowledge
          key: ${{ steps.face-builds.outputs.cache-primary-key }}

      - name: Set up Node for face browser tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dna/face/package-lock.json

      # GH #1417 (R8a): the TypeScript client `hale api client --lang ts`
      # generates compiles under `tsc --strict` and speaks the contract's wire
      # on node's fetch and WebSocket against a server that replays
      # tests/api-contract/wire; the JavaScript client (`--lang js`) checks
      # under `tsc --checkJs --strict` and runs the same scenarios. Node is set up above; TypeScript is installed
      # beside it, not into the face's package.json. It runs in the same
      # `scope`-classified job as the browser tests, and only when code changed.
      - name: Generated TypeScript and JavaScript clients
        if: matrix.shard == '1'
        env:
          HALE_BIN: ${{ github.workspace }}/target/release/hale
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/typescript" typescript@5
          TSC="$RUNNER_TEMP/typescript/node_modules/.bin/tsc" node crates/hale-cli/tests/fixtures/ts-client/run.mjs

      - name: Face browser integration (${{ matrix.shard }})
        working-directory: dna/face
        # The owner's DSN reaches only the fixtures that migrate or drop a
        # record and the host the native command lanes start (`hale dna
        # dev`, GH #1029); the harness strips memory's DSNs and the nerves'
        # URLs from every other process it starts and gives the API the
        # head's. HALE_NATIVE_COMMAND_API turns the native command lanes on:
        # the composed head as their API, `hale dna dev` (HALE_BIN) as
        # their host over this NATS and this Postgres.
        #
        # The shard picks its specs by file. Playwright's --grep matches a
        # case's file path as well as its title, so shard 1 names its
        # files and shard 2 inverts the same pattern: between them every
        # spec runs exactly once, and a new spec file lands in shard 2.
        # The two carry about 315 s of Playwright each (measured on run
        # 36371607135: startup.spec 96 s, and 47 s to 53 s each for
        # native-knowledge-browser, organization-structure, organization
        # and organization-navigation, of 534 s for everything else); move
        # a file between them only with a look at a run's per-spec times.
        env:
          HALE_DNA_MEMORY_DSN_OWNER: postgres://dna:dna@127.0.0.1:5480/dna?sslmode=disable
          HALE_DNA_NATS_URL_OWNER: nats://127.0.0.1:4222
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          shard_one='(^|[ /])(startup|native-knowledge-browser|organization-structure|organization|organization-navigation)\.spec\.mjs'
          case "$SHARD" in
            1) select=(--grep "$shard_one") ;;
            2) select=(--grep-invert "$shard_one") ;;
            *) echo "::error::unknown shard $SHARD"; exit 1 ;;
          esac
          knowledge=(
            HALE_FACE_KNOWLEDGE_BIN="$GITHUB_WORKSPACE/target/seeds/knowledge/knowledge"
            HALE_KNOWLEDGE_API_BIN="$GITHUB_WORKSPACE/target/seeds/api/api"
            HALE_KNOWLEDGE_SEED_BIN="$GITHUB_WORKSPACE/target/seeds/knowledge/knowledge"
          )
          npm ci
          npx playwright install --with-deps chromium --only-shell
          HALE_BIN="$GITHUB_WORKSPACE/target/release/hale" \
            HALE_API_BIN="$GITHUB_WORKSPACE/target/seeds/api/api" \
            HALE_NATIVE_COMMAND_API="$GITHUB_WORKSPACE/target/seeds/practice_review/practice_review" \
            HALE_NATIVE_HEAD_BIN="$GITHUB_WORKSPACE/target/seeds/project_service/project_service" \
            env "${knowledge[@]}" npm test -- "${select[@]}" || result=$?
          exit "${result:-0}"

      - name: Preserve face browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: face-browser-failures-${{ matrix.shard }}
          path: dna/face/test-results
          if-no-files-found: ignore
          retention-days: 7

      - *tree-is-clean

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # GH #912 E2 — the two shapes cargo-nextest never runs.
  #
  # Every job above goes through nextest, which gives each test its
  # own process and skips doctests entirely. So two failure shapes
  # are invisible here and land only on whoever types `cargo test`:
  #
  #   * libtest runs a binary's tests as THREADS of one process, so
  #     anything process-wide two tests in the same file touch — the
  #     environment, the cwd, a fixed temp path — races. The suite is
  #     structurally clean of that today (`harness::unique_bin`, the
  #     `BuildOptions` knobs of GH #843, `harness_paths_are_unique`);
  #     this job is what keeps it clean.
  #   * `cargo test --doc` compiles the code blocks in `///` and
  #     `//!` comments as Rust, INDENTED blocks included — no fence
  #     needed to become a doctest. An indented ABI sketch in
  #     `channels/mod.rs` had made `cargo test -p hale-codegen` exit
  #     101 since 2026-05-25, and nothing in CI could see it.
  #
  # Scope, measured on 2026-09-20. The whole in-process shape
  # (`-p hale-codegen -p hale-cli --lib --tests`) is 452 test
  # binaries to compile — the `codegen` half-job spends ~4min on 167
  # of them — plus 190s of run time for hale-codegen alone on a
  # 16-core box; against a slowest job of 5m47s (run 35552221931)
  # that job would be the new critical path, several times over. So:
  # doctests for the whole workspace, which cost only the lib builds
  # the workspace build already does, and the thread shape for the
  # binaries that actually share process-wide state — the ones that
  # reach for a build knob which used to be a process-env var
  # (`harness::build_ir_text` / `build_asan`),
  # take a cross-test lock file, or hardcode a multicast group, plus
  # everything `.config/nextest.toml` already had to put in a
  # `max-threads` group. 32 binaries and 41s of run time, and the
  # list is COMPUTED rather than listed, so a new test that reaches
  # for one of those joins the gate by itself. `dna_native_suite` is
  # the one group member left out by name: it is 380-415s on its own
  # and has two jobs of its own above.
  # GH #970: the cross build, end to end. A foreign Linux triple links
  # here through zig and a target sysroot; this job builds the sysroots
  # the way a user would (`scripts/target-sysroot.sh`, cached on their
  # inputs — OpenSSL from source is a minute each), cross-compiles from
  # the x86_64 runner, and RUNS the results, so "it links" is not the
  # claim — "it runs on the target" is: aarch64 gnu under
  # qemu-user-static with the target's glibc, aarch64 musl under qemu
  # alone (static), and x86_64 musl directly on the runner — a static
  # binary is foreign to a glibc host in name only. The macOS workflow
  # does the Mac→Linux half up to the ELF header; this is the only place
  # an emitted cross binary executes.
  cross:
    name: cross (x86_64 → aarch64 gnu + musl, x86_64 musl; runs them)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      ZIG_VERSION: 0.16.0
      CROSS_TRIPLE: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (+ each target's std for the ts-shim)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl,x86_64-unknown-linux-musl

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - *sccache-health

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: false

      - name: Install LLVM 18 + clang + qemu (+ the target's glibc for it)
        # qemu-user runs the aarch64 ELF but not on its own: the binary
        # asks for /lib/ld-linux-aarch64.so.1 and libc, which have to be
        # the TARGET's. libc6-arm64-cross puts those under
        # /usr/aarch64-linux-gnu, and `-L` points qemu there.
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev \
            qemu-user-static libc6-arm64-cross

      - name: Install zig ${{ env.ZIG_VERSION }}
        # The release tarball, pinned: zig is the cross C toolchain and
        # its version is part of the runtime object cache key.
        run: |
          set -eux
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$HOME"
          echo "$HOME/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Cache the target sysroots
        id: sysroot
        uses: actions/cache@v4
        with:
          path: ~/.cache/hale/sysroot
          key: sysroots-gnu+musl-zig${{ env.ZIG_VERSION }}-${{ hashFiles('scripts/target-sysroot.sh', 'crates/hale-ts-shim/Cargo.toml', 'crates/hale-codegen/runtime/lotus_treesitter.rs', 'Cargo.lock') }}

      - name: cargo build --release --workspace
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: Build the target sysroots (OpenSSL, zlib, ts-shim per target)
        if: steps.sysroot.outputs.cache-hit != 'true'
        run: |
          set -eux
          for t in aarch64-unknown-linux-gnu aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            scripts/target-sysroot.sh "$t"
          done

      - name: Cross-build and run under qemu
        run: |
          set -eux
          zig version
          cat ~/.cache/hale/sysroot/"$CROSS_TRIPLE"/VERSIONS
          mkdir -p /tmp/cross
          cat > /tmp/cross/hello.hl <<'HL'
          type Tick { n: Int; }

          locus Sub {
              bus { subscribe "tick" as on_tick of type Tick; }
              fn on_tick(t: Tick) {
                  println("worker got tick ", t.n);
              }
          }

          main locus App {
              params {
                  sub: Sub = Sub { };
              }
              placement {
                  sub: cooperative(pool = jobs);
              }
              bus { publish "tick" of type Tick; }
              run() {
                  "tick" <- Tick { n: 7 };
                  std::time::sleep(200ms);
                  println("cross main done");
              }
          }

          fn main() {
              App { };
          }
          HL
          ./target/release/hale build --target "$CROSS_TRIPLE" /tmp/cross/hello.hl
          file /tmp/cross/hello | tee /tmp/cross/file.out
          grep -q 'ELF 64-bit LSB.*ARM aarch64' /tmp/cross/file.out
          test ! -e /tmp/cross/hello.o
          # The second build links from cached runtime objects.
          time ./target/release/hale build --target "$CROSS_TRIPLE" /tmp/cross/hello.hl
          out="$(qemu-aarch64-static -L /usr/aarch64-linux-gnu /tmp/cross/hello)"
          echo "program output: $out"
          echo "$out" | grep -q "worker got tick 7"
          echo "$out" | grep -q "cross main done"

          # musl, aarch64: static, so qemu needs no target libc at all.
          ./target/release/hale build --target aarch64-unknown-linux-musl /tmp/cross/hello.hl
          file /tmp/cross/hello | tee /tmp/cross/file.out
          grep -q 'ELF 64-bit LSB.*ARM aarch64.*statically linked' /tmp/cross/file.out
          out="$(qemu-aarch64-static /tmp/cross/hello)"
          echo "$out" | grep -q "cross main done"

          # musl, x86_64: a cross target from this gnu host in name only —
          # the static binary runs right here.
          ./target/release/hale build --target x86_64-unknown-linux-musl /tmp/cross/hello.hl
          file /tmp/cross/hello | tee /tmp/cross/file.out
          grep -q 'ELF 64-bit LSB.*x86-64.*statically linked' /tmp/cross/file.out
          out="$(/tmp/cross/hello)"
          echo "$out" | grep -q "worker got tick 7"
          echo "$out" | grep -q "cross main done"

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  parity:
    name: parity (cargo test + doctests)
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - *sccache-health

      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: cargo build --release --workspace
        # For `libhale_ts_shim.a` (see the cli job).
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: cargo test --release --doc --workspace
        # nextest runs no doctests at all, so this is the only place
        # a `///` code block is compiled.
        run: cargo test --release --doc --workspace --features hale-codegen/dynamic-llvm

      - name: cargo test (one process per binary, libtest threads)
        run: |
          set -euo pipefail
          # Binaries the repo has already marked as sharing something,
          # minus the DNA fixture suite (see the header comment).
          grouped=$(grep -oE 'binary\([a-z0-9_]+\)' .config/nextest.toml \
            | sed 's/^binary(//; s/)$//' | sort -u \
            | grep -vx dna_native_suite || true)
          for crate in hale-codegen hale-cli; do
            dir="crates/$crate/tests"
            # A build knob that used to be a process-env var; the
            # `create_new` idiom both cross-test lock files use; a
            # hardcoded multicast group.
            marked=$(grep -lE 'build_ir_text|build_asan|create_new\(true\)|239\.' \
              "$dir"/*.rs 2>/dev/null | xargs -n1 basename | sed 's/\.rs$//' || true)
            names=$(printf '%s\n%s\n' "$marked" "$grouped" | sort -u \
              | while read -r n; do
                  [ -n "$n" ] && [ -f "$dir/$n.rs" ] || continue
                  # A file is a binary of its own (a [[test]] in
                  # Cargo.toml) or a module an area root names with
                  # #[path]: run the binary that holds it.
                  if grep -q "^path = \"tests/$n\.rs\"" "crates/$crate/Cargo.toml"; then
                    printf '%s\n' "$n"; continue
                  fi
                  root=$(grep -lF "#[path = \"$n.rs\"]" "$dir"/*.rs | head -1 || true)
                  if [ -n "$root" ]; then basename "$root" .rs; else printf '%s\n' "$n"; fi
                done | sort -u)
            if [ -z "$names" ]; then
              echo "$crate: no shared-state binaries"; continue
            fi
            echo "== $crate: $(printf '%s\n' "$names" | wc -l) binaries =="
            printf '%s\n' "$names"
            # hale-cli is a bin crate — it has no lib target to test.
            lib=""
            if [ "$crate" = hale-codegen ]; then lib="--lib"; fi
            args=$(printf -- '--test %s ' $names)
            cargo test --release -p "$crate" --features dynamic-llvm $lib $args
          done

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  # 2026-05-26 — TSAN regression coverage for the lockfree
  # substrate paths. F.32-1γ-v2 + the substrate-race-fixes work
  # closed five originally-flagged TSAN races
  # (bus_queue_drain multi-thread flag, arena subregion mutex,
  # arena_destroy / coop_pool_worker ordering, lazy-init env
  # helpers via pthread_once) — the lockfree hashmap path
  # validates clean with an empty suppression list. This job
  # locks that in: any future regression that re-races on the
  # lockfree set / get / remove / grow paths fails CI here.
  #
  # Separate job because TSAN-instrumented binaries are ~5-15×
  # slower; running the full workspace under TSAN would gate
  # PRs on 30+ minute CI. The dedicated suite at
  # `crates/hale-codegen/tests/form_hashmap_lockfree_tsan.rs`
  # covers the substrate paths we care about + completes in
  # under a minute.
  tsan:
    needs: scope
    if: needs.scope.outputs.substrate == 'true'
    name: tsan (form_hashmap_lockfree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - *sccache-health

      # Dependency artifacts only (see the test job); the sanitizer
      # env vars reach clang at test time, not the Rust build, so
      # this cache is the same shape as the test job's.
      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tsan-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: cargo build --release --workspace
        # Build the whole workspace so `libhale_ts_shim.a` lands
        # at target/release/ before the test binaries try to
        # link against it — codegen tests invoke clang to link
        # compiled .hl programs, and the link surface includes
        # the ts-shim by path-probe (no cargo dep edge forces
        # it, so `-p hale-codegen` alone misses the staticlib
        # and clang errors with `undefined reference to lotus_ts_*`).
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: LOTUS_TSAN=1 cargo test (form_hashmap_lockfree_tsan)
        # The TSAN tests are #[ignore]'d so the normal suite
        # skips them; --ignored opts in. LOTUS_TSAN=1 in env is
        # turned into `BuildOptions::tsan` by the test's own build,
        # which passes -fsanitize=thread to clang for both the
        # runtime C compile and the binary link. The C runtime's embedded
        # __tsan_default_suppressions returns empty as of
        # 2026-05-26 — any race surfaced here is a new
        # regression and gates the merge.
        env:
          LOTUS_TSAN: "1"
        run: |
          cargo test --release -p hale-codegen --features dynamic-llvm \
            --test form_hashmap_lockfree_tsan \
            -- --ignored --test-threads=1 --nocapture

  # 2026-06-02 — AddressSanitizer + LeakSanitizer coverage for the
  # compiled example corpus. The broad corpus is otherwise only
  # parse-tested + type-checked + interpreter-run (exit-0); the
  # interpreter has no arenas/pools/coros, so it can't surface the
  # teardown leaks, shutdown use-after-free, and buffer overflows
  # that keep appearing at feature intersections in real apps.
  # `corpus_oracle` compiles every runnable fixture to native and
  # runs it under the oracle battery; this job adds the sanitizer
  # arm. Three closure epoch-fire leaks are quarantined in the test
  # (KNOWN_CLOSURE_LEAKS) so the gate is green on the known state —
  # any NEW leak/UAF/overflow in any other fixture fails here.
  #
  # Separate job like tsan: ASAN-instrumented builds are slower and
  # need the wrap-malloc shim disabled, so they don't belong in the
  # normal partitions. The plain exit+deadline arm of corpus_oracle
  # DOES run in those partitions (no extra toolchain needed).
  asan:
    needs: scope
    if: needs.scope.outputs.substrate == 'true'
    name: sanitizers (asan corpus + ubsan foreign-ring)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - *sccache-health

      # Dependency artifacts only (see the test job); the sanitizer
      # env vars reach clang at test time, not the Rust build, so
      # this cache is the same shape as the test job's.
      - name: Cache cargo registry + dependency artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: asan-x86_64-linux-llvm18
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install LLVM 18 + clang
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev

      - name: cargo build --release --workspace
        run: cargo build --release --workspace --features hale-codegen/dynamic-llvm

      - name: check/build agreement over the embedded corpus
        # `hale check` accepting what `hale build` refuses is the
        # worst failure mode the toolchain has: the error arrives
        # late, from another layer, usually without a span, and it
        # tells the author their working program is broken. Three
        # were found by accident in one afternoon; all three lived in
        # the ~1300 programs embedded in Rust test strings, which
        # were typechecked but never compiled (the 92 file fixtures
        # ARE compiled, by corpus_oracle below).
        #
        # A ratchet against a recorded baseline: a NEW divergence
        # fails, and so does a FIXED one, so the list cannot rot.
        # #[ignore]'d like the sweeps below since it compiles ~1500
        # programs; --ignored opts in. The sweep runs on every core
        # (#927: 6.7min serial on a 4-core runner, ~2min now;
        # HALE_CORPUS_SWEEP_THREADS=1 restores the serial walk).
        # Folded into this job to reuse the release build above.
        run: |
          cargo test --release -p hale-codegen --features dynamic-llvm \
            --test corpus_check_build_agreement \
            -- --ignored --nocapture

      - name: LOTUS_ASAN=1 cargo test (corpus_oracle under ASAN)
        # #[ignore]'d like the tsan suite; --ignored opts in.
        # LOTUS_ASAN=1 is turned into `BuildOptions::asan` by the
        # test's own build (codegen reads no environment variable),
        # which passes -fsanitize=address to clang for the runtime C
        # compile + binary link. A new leak outside KNOWN_CLOSURE_LEAKS, or
        # any UAF/overflow, gates the merge.
        env:
          LOTUS_ASAN: "1"
        run: |
          cargo test --release -p hale-codegen --features dynamic-llvm \
            --test corpus_oracle \
            -- --ignored --test-threads=1 --nocapture

      # 2026-06-08 — UBSan (+ASan) coverage for the foreign-ring
      # (`ring_layout`) boundary, folded into THIS job to reuse the
      # workspace build above (a separate job would redo the expensive
      # LLVM-linked release build for no benefit). `ring_layout` reads
      # rings written by another program, so the interesting failures
      # are at the non-conforming / hostile foreign-producer edge: a
      # record `len` that disagrees with the bound payload size, a
      # `buffer_size` that isn't an `align` multiple, a pack-read offset
      # near INT64_MAX. A review found three OOB holes there the normal
      # corpus never hit (it stays inside the safe invariants); this step
      # runs the suites that DO exercise those edges with LOTUS_UBSAN=1
      # (clang -fsanitize=address,undefined -fno-sanitize-recover), so a
      # signed-overflow / OOB / wrongful-dispatch regression aborts and
      # gates the merge. Scoped to the foreign-ring + pack tests on
      # purpose: a full-corpus UBSan run could surface unrelated latent
      # UB elsewhere (a separate effort). Leaks stay the ASan step's
      # remit (detect_leaks=0 here) so this stays focused on UB / OOB.
      - name: LOTUS_UBSAN=1 foreign-ring + pack suite (under ASan+UBSan)
        env:
          LOTUS_UBSAN: "1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
          ASAN_OPTIONS: "detect_leaks=0"
        run: |
          cargo test --release -p hale-codegen --features dynamic-llvm \
            --test bytes_pack_read \
            --test shm_ring_layout \
            --test shm_ring_layout_producer \
            -- --test-threads=1 --nocapture

  # GH issue #18 item 2: model-check the substrate's concurrent
  # primitives under ALL C11 interleavings (not just the schedules a
  # test happens to hit). GenMC runs the actual C; a race / UAF /
  # assertion violation in any verification/*_model.c gates the merge.
  # No Rust/cargo — this job only needs LLVM 18 + cmake to build GenMC
  # and clang to run the models.
  genmc:
    needs: scope
    if: needs.scope.outputs.substrate == 'true'
    name: genmc (substrate race-completeness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 + clang + cmake
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            clang-18 libclang-18-dev zlib1g-dev cmake

      # GenMC builds against LLVM 18 in a few minutes; cache the built
      # tree keyed on build_genmc.sh (which pins the GenMC commit), so
      # it only rebuilds when the pin / build recipe changes.
      - name: Cache GenMC build
        uses: actions/cache@v4
        with:
          path: ~/genmc
          key: genmc-llvm18-${{ hashFiles('verification/build_genmc.sh') }}

      # Build only if the cache missed OR restored a binary that no
      # longer runs (e.g. libLLVM patch bump under a stale cache).
      - name: Build GenMC if needed
        run: |
          set -eux
          if ! "$HOME/genmc/build/bin/genmc" --version >/dev/null 2>&1; then
            verification/build_genmc.sh "$HOME/genmc"
          fi

      - name: Run substrate model checks
        run: GENMC="$HOME/genmc/build/bin/genmc" verification/run_genmc.sh

  # The one check the merge rules require. A prose-only diff scopes the
  # partitions out at the job level, and a skipped matrix job reports
  # under its template name ("cli ${{ matrix.part }}/5"), so the expanded
  # names cannot be required one by one: a docs-only pull request would
  # wait forever for "cli 1/5". This job runs always, and is green when
  # scope and the quick jobs succeeded and every other job succeeded or was
  # scoped out, red when any failed or was cancelled. The merge queue's
  # run, where every job runs, gates the merge through the same check.
  required:
    name: required
    runs-on: ubuntu-latest
    needs: [scope, quick-build, quick, docs, build-cli, build-codegen, cli, codegen, dna, face-api, face-browser, cross, parity, tsan, asan, genmc]
    if: always()
    steps:
      - name: every job green or scoped out
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"'
          must=$(echo "$RESULTS" | jq -r '["scope","quick-build","quick"][] as $k | select(.[$k].result != "success") | $k')
          bad=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$must$bad" ]; then echo "::error::not green: $must $bad"; exit 1; fi
