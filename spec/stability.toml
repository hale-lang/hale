experimental_sections = [
    "U64 — a 64-bit unsigned integer",
    "Fixed-width integers — I32, U32, I16, U16, I8, U8",
    "U256 and I256 — 256-bit integers",
    "Scalar types (GH #1076)",
    "Roles (GH #1109, #1417)",
    "Working-set estimator (F.32-2)",
]

[spec."semantics.md"]
tier = "stable"
experimental_sections = [
    "Probes",
    "Observe backends (GH #1592)",
]

[spec."memory.md"]
tier = "stable"
experimental_sections = ["Allocator implementation outline", "What the compiler emits", "Codegen ABI (v0)"]

[spec."forms.md"]
tier = "stable"

[spec."stdlib.md"]
tier = "stable"

[spec."ffi.md"]
tier = "stable"
experimental_sections = ["WASM host interface", "C→Hale re-entry: `@export fn` on native (Crumb batch 2, 2026-07-27)"]

[spec."projects.md"]
tier = "stable"

[spec."testing.md"]
tier = "stable"
experimental_sections = ["Property-based testing"]

[spec."styleguide.md"]
tier = "stable"

[spec."verification.md"]
tier = "stable"
experimental_sections = ["Fleet composition (GH #408 Phase 1)", "The requirements artifact (GH #1835)"]

[spec."runtime.md"]
