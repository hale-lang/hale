name: macos

# Phase-1 macOS (Apple Silicon) portability guard.
#
# The compiler (Rust/inkwell) already builds on macOS in the release
# workflow; what this job validates is the RUNTIME + codegen link line:
# the lotus C runtime compiles + runs on macOS, `async_io` pools
# included (kqueue, GH #970).
#
# This is the real validator for the macOS work (the dev box is Linux and
# cannot compile for macOS). It:
#   (a) builds the workspace,
#   (b) compiles + RUNS a hello-world .hl,
#   (c) compiles + RUNS a cooperative-pool + bus .hl,
#   (d) builds + RUNS a `where async_io` .hl — the kqueue backend.
#
# Kept in its own workflow so it runs on push/PR without gating the
# Linux-only required checks in tests.yml.

# One run per commit. A push to a PR branch used to trigger this
# twice — once as `push` (every branch) and once as `pull_request`
# — in two concurrency groups, so neither cancelled the other:
# 140 of 140 pull_request runs over 2026-09-18..20 had a twin push
# run on the same SHA. Push runs are for main only now; a branch
# gets its run through its PR.
on:
  push:
    branches: [main]
    # A prose change cannot alter what the macOS build produces. This
    # is a whole-workflow filter rather than the `scope` job
    # `tests.yml` uses, because there is one job here and nothing to
    # gate selectively.
    paths-ignore: &prose
      - '**.md'
      - 'docs/**'
      - 'spec/**'
      - 'notes/**'
      - 'agents/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore: *prose
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: build + run (macos-14, Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 18 + OpenSSL 3 (Homebrew)
        # llvm@18: inkwell/llvm-sys links libLLVM.18 dynamically (must
        # match the crate's llvm18-0 pin). openssl@3: lotus_tls.c is
        # compiled on every build and #includes <openssl/ssl.h>; brew
        # openssl is keg-only, so codegen needs its include/lib prefix
        # (resolved from $LOTUS_OPENSSL_PREFIX). The C runtime itself is
        # compiled + linked by the system (Apple) `clang` on PATH.
        run: |
          set -eux
          brew install llvm@18 openssl@3
          echo "LLVM_SYS_180_PREFIX=$(brew --prefix llvm@18)" >> "$GITHUB_ENV"
          echo "LOTUS_OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-macos14-arm64-llvm18-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-macos14-arm64-llvm18-

      - name: cargo build --release --workspace
        # Build ALL workspace members so libhale_ts_shim.a lands at
        # target/release/ before the `hale` binary links a compiled .hl
        # (codegen appends the staticlib by path-probe).
        run: cargo build --release --workspace

      - name: (a) hello-world compiles + runs
        run: |
          set -eux
          mkdir -p /tmp/hlci
          cat > /tmp/hlci/hello.hl <<'HL'
          locus Greeter {
              run() {
                  println("hello from hale on macos");
              }
          }
          fn main() {
              Greeter { };
          }
          HL
          out="$(cargo run -q -p hale-cli --bin hale -- run /tmp/hlci/hello.hl)"
          echo "program output: $out"
          echo "$out" | grep -q "hello from hale on macos"

      - name: (b) cooperative-pool + bus compiles + runs
        run: |
          set -eux
          cat > /tmp/hlci/coop_bus.hl <<'HL'
          type Tick { n: Int; }

          locus Sub {
              bus { subscribe "tick" as on_tick of type Tick; }
              fn on_tick(t: Tick) {
                  println("worker got tick ", t.n);
              }
          }

          main locus App {
              params {
                  sub: Sub = Sub { };
              }
              placement {
                  sub: cooperative(pool = jobs);
              }
              bus { publish "tick" of type Tick; }
              run() {
                  "tick" <- Tick { n: 7 };
                  std::time::sleep(200ms);
                  println("main done");
              }
          }

          fn main() {
              App { };
          }
          HL
          out="$(cargo run -q -p hale-cli --bin hale -- run /tmp/hlci/coop_bus.hl)"
          echo "program output: $out"
          echo "$out" | grep -q "worker got tick 7"
          echo "$out" | grep -q "main done"

      - name: (c) `where async_io` builds and runs (kqueue backend)
        run: |
          set -eux
          # The in-language async_io test: a listener on an async_io
          # pool, a client, a handler that parks on the fd. It used to
          # be the program this step asserted FAILED to build.
          cargo run -q -p hale-cli --bin hale -- test tests/hale/async_handler_payload_test.hl
          # And the corpus example that places one.
          cargo run -q -p hale-cli --bin hale -- run crates/hale-codegen/tests/fixtures/examples/88-async-handler-payload/main.hl

      - name: (d) GH 231 — emitted binaries link OpenSSL statically
        run: |
          set -eux
          # The (a) step built /tmp/hlci binaries with the PR's
          # codegen; any emitted binary links lotus_tls. Assert no
          # Homebrew OpenSSL dylib survives in the load commands —
          # the static libssl.a/libcrypto.a path must have won.
          cargo run -q -p hale-cli --bin hale -- build /tmp/hlci/coop_bus.hl
          otool -L /tmp/hlci/coop_bus | tee /tmp/hlci/otool.out
          if grep -E "openssl|libssl|libcrypto" /tmp/hlci/otool.out; then
            echo "emitted binary still links OpenSSL dynamically" >&2
            exit 1
          fi

      - name: (e) GH 231 — toolchain vendoring rewrite launches
        run: |
          set -eux
          # Rehearse the release workflow's libunwind vendoring on
          # the PR-built binary: copy, rewrite the load command to
          # @executable_path, drop the vendored dylib beside it,
          # and prove the rewritten binary launches (the release
          # tarball ships exactly this shape).
          mkdir -p /tmp/hlci/vendored
          cp target/release/hale /tmp/hlci/vendored/hale
          BIN=/tmp/hlci/vendored/hale
          # Vendor EVERY non-system dylib (libunwind, libzstd, and
          # anything the formulas grow next), then fix the vendored
          # dylibs' own load commands + install ids. Two passes over
          # the dylib set handles dylib-to-dylib references.
          vendor_dir="$(dirname "$BIN")"
          for pass in 1 2; do
            for f in "$BIN" "$vendor_dir"/*.dylib; do
              [ -e "$f" ] || continue
              for LIB in $(otool -L "$f" | awk '/\/opt\/homebrew|\/usr\/local\/Cellar/ {print $1}'); do
                base="$(basename "$LIB")"
                [ -e "$vendor_dir/$base" ] || cp "$LIB" "$vendor_dir/$base"
                install_name_tool -change "$LIB" "@executable_path/$base" "$f"
              done
            done
          done
          for d in "$vendor_dir"/*.dylib; do
            [ -e "$d" ] || continue
            install_name_tool -id "@executable_path/$(basename "$d")" "$d"
            codesign --force --sign - "$d"
          done
          codesign --force --sign - "$BIN"
          # Audit: nothing outside /usr/lib + @executable_path may
          # remain across the binary AND the vendored dylibs.
          for f in "$BIN" "$vendor_dir"/*.dylib; do
            [ -e "$f" ] || continue
            if otool -L "$f" | grep -E "/opt/homebrew|/usr/local/Cellar"; then
              echo "non-system dylib dependency survived in $f" >&2
              exit 1
            fi
          done
          /tmp/hlci/vendored/hale || true
          file /tmp/hlci/vendored/hale

      - name: (f) GH #638 — a body finds the tools it started, wherever they ended up
        run: |
          set -eux
          # The body fence stops what a body started; a tool whose
          # organization already died was reparented, so the fence finds
          # it by the mark every process a body starts carries in its
          # environment. Linux reads /proc; here it is `ps -E`, and what
          # the kernel will disclose is the question — so report it, then
          # run the fixture that asserts the mechanism end to end.
          env HALE_DNA_SCAN_PROBE=yes sh -c \
            'ps -E -ww -o pid=,command= -p $$ | grep -q HALE_DNA_SCAN_PROBE=yes' \
            && echo "ps -E shows a process its own environment on this runner" \
            || echo "ps -E does NOT show environments here: the fence reaches only a living organization's tree"
          cargo run -q -p hale-cli --bin hale -- test dna/tests/body_scan_test.hl

      - name: Cache the Linux target sysroot (GH #970)
        # Keyed on everything that goes into it: the script (OpenSSL
        # and zlib pins), the ts-shim's inputs, and the zig the
        # formula installs today.
        uses: actions/cache@v4
        with:
          path: ~/.cache/hale/sysroot/aarch64-unknown-linux-gnu
          key: sysroot-aarch64-unknown-linux-gnu-macos14-${{ hashFiles('scripts/target-sysroot.sh', 'crates/hale-ts-shim/Cargo.toml', 'crates/hale-codegen/runtime/lotus_treesitter.rs', 'Cargo.lock') }}

      - name: (g) GH #970 — a Mac builds a Linux binary
        # The Mac→Linux half of the cross story: zig as the cross C
        # toolchain, the target sysroot built the way a user would
        # (cached on its inputs — OpenSSL from source is minutes), and
        # the result checked by its header, since nothing here can run
        # an aarch64 ELF. tests.yml's `cross` job runs one under qemu.
        run: |
          set -eux
          brew install zig
          zig version
          rustup target add aarch64-unknown-linux-gnu
          # A cached sysroot is one an earlier run built and checked;
          # only build when the cache had none.
          [ -f ~/.cache/hale/sysroot/aarch64-unknown-linux-gnu/lib/libssl.a ] \
            || scripts/target-sysroot.sh aarch64-unknown-linux-gnu
          cat ~/.cache/hale/sysroot/aarch64-unknown-linux-gnu/VERSIONS
          cargo run -q -p hale-cli --bin hale -- build --target aarch64-unknown-linux-gnu /tmp/hlci/coop_bus.hl
          file /tmp/hlci/coop_bus | tee /tmp/hlci/cross-file.out
          grep -q 'ELF 64-bit LSB.*ARM aarch64' /tmp/hlci/cross-file.out
          test ! -e /tmp/hlci/coop_bus.o
