[spec."packages.md"]
tier = "experimental"
why = "the manifest, the lockfile and `hale fetch` are a first cut; registries and version resolution are not designed"

[spec."units.md"]
tier = "experimental"
why = "the unit dialect is new (GH #1076) and its rows are still growing"

[spec."api.md"]
tier = "experimental"
why = "the api binding's surfaces, transports and clients are still converging (GH #1417)"

[spec."model.md"]
tier = "experimental"
why = "the canonical model's tables grow with every judgment family; its Reserved families have no producer"

[spec."registry.md"]
tier = "experimental"
why = "a generated index of the compiler's own families; it describes the implementation, not the language"

[spec."api-description.schema.json"]
tier = "experimental"
why = "the api description's schema moves with spec/api.md"

[spec."dna.md"]
tier = "experimental"
why = "DNA is a library built on the language, and its surfaces move with its delivery"

[spec."habitat.md"]
