name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "play/**"
      - "crates/hale-model/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "play/**"
      - "crates/hale-model/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Pages deployment requires these tokens.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one in-flight Pages deploy at a time; cancel queued runs
# but never interrupt a deploy already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  LLVM_SYS_180_PREFIX: /usr/lib/llvm-18

jobs:
  build:
    name: Build site (docs + playground)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # --- docs (mdBook) ---
      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/mdbook
            ~/.cargo/bin/mdbook-toc
          key: mdbook-${{ runner.os }}-v1

      - name: Install mdbook + preprocessors
        run: |
          set -e
          for tool in mdbook mdbook-toc; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              cargo install --locked "$tool"
            fi
          done

      # GH #228: every ```hale snippet in docs/src must parse
      # (deliberately-partial blocks are fenced ```hale,fragment).
      # The gate also runs in the main test shards as part of the
      # hale-syntax suite; running it here too makes a docs-only
      # PR fail fast without waiting on the full suite.
      - name: Docs snippet parse gate
        run: cargo test --release -p hale-syntax --test docs_snippets

      - name: Build docs
        run: mdbook build docs

      # The model's API reference. `spec/model.md` is the contract and
      # the book chapter is the explanation; neither says what a given
      # field holds, and that answer lived only in the source — so a
      # consumer reading artifacts had to clone the compiler to look
      # up a row.
      #
      # Runs on PRs too, unlike the playground below: hale-model is
      # deliberately dependency-free, so this is a sub-second build
      # with no LLVM and no toolchain install. `-D warnings` makes a
      # broken intra-doc link fail here rather than ship as a dead
      # link on the site.
      - name: Build the model API reference
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p hale-model

      - name: Stage the API reference under the docs site (/api)
        run: |
          mkdir -p docs/book/api
          cp -r target/doc/. docs/book/api/

      # --- playground: compile the examples + the Hale UI to wasm ---
      # Heavy (LLVM 18 + a compiler build), so skip it on PRs — it runs
      # only on main / manual dispatch, i.e. when we actually deploy.
      - name: Install Rust toolchain
        if: github.event_name != 'pull_request'
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 18 + clang
        if: github.event_name != 'pull_request'
        run: |
          set -eux
          # the runners' resolver stopped answering for Ubuntu's archive
          # (2026-11-11): fetch from archive.ubuntu.com at an address a public
          # resolver gives (a known one if it gives none), retrying a failed download
          for f in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list; do
            if [ -f "$f" ]; then sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors\.txt#http://archive.ubuntu.com/ubuntu/#; s#https?://azure\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#' "$f"; fi
          done
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          # some of the archive's addresses answered with indexes that lack
          # the LLVM packages: each try pins the next address
          ips=$(dig +short +time=3 +tries=2 @1.1.1.1 archive.ubuntu.com A 2>/dev/null | grep -E '^[0-9.]+$' || true)
          ok=
          for ip in $ips 185.125.190.81 91.189.91.82 185.125.190.83; do
            sudo sed -i '/ archive\.ubuntu\.com security\.ubuntu\.com$/d' /etc/hosts
            echo "$ip archive.ubuntu.com security.ubuntu.com" | sudo tee -a /etc/hosts >/dev/null
            if sudo apt-get update && sudo apt-get install -y \
              llvm-18-dev libpolly-18-dev libzstd-dev \
              clang-18 libclang-18-dev zlib1g-dev; then ok=1; break; fi
          done
          [ -n "$ok" ]

      - name: Cache cargo (compiler build)
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pages-${{ runner.os }}-llvm18-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-pages-${{ runner.os }}-llvm18-

      - name: Build the hale compiler
        if: github.event_name != 'pull_request'
        run: cargo build --release -p hale-cli

      - name: Build the playground (examples + UI -> wasm)
        if: github.event_name != 'pull_request'
        run: bash play/build.sh

      - name: Stage the playground under the docs site (/play)
        if: github.event_name != 'pull_request'
        run: cp -r play/site docs/book/play

      # The book itself is read on hale-lang.org, which syncs docs/src
      # and follows SUMMARY.md; this Pages copy serves only /play and
      # /api. Every book page becomes a redirect to the same page on
      # the site, so old links keep working and there is one book.
      - name: Replace the book's pages with redirects to hale-lang.org
        if: github.event_name != 'pull_request'
        run: scripts/book-redirect-stubs.sh docs/book

      # --- publish the combined site ---
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

      # mdbook-admonish + mdbook-linkcheck deferred — each has a
      # compat issue with mdbook 0.5.x. Re-add when upstream catches up.

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
