[package]
name = "hale-codegen"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Hale codegen targeting LLVM"
# Test targets are listed below, not discovered (see `every_test_file_is_built`).
autotests = false

[dependencies]
hale-frontend = { path = "../hale-frontend" }
# The shadow facility (`hale_graph::shadow`), for the capability
# matrix's lowering shadow, and the workspace's one FNV fold
# (`hale_graph::identity::fnv64`) the bus payload id is.
hale-graph = { path = "../hale-graph" }
hale-model = { path = "../hale-model" }
hale-stdlib = { path = "../hale-stdlib" }
hale-syntax = { path = "../hale-syntax" }
hale-types = { path = "../hale-types" }
inkwell = { version = "0.5", features = ["llvm18-0"] }

[features]
# llvm-sys links LLVM statically unless told otherwise, so every
# binary that depends on this crate — the compiler, and each of the
# ~550 integration-test binaries the workspace builds — carries its
# own ~100MB copy of libLLVM. CI enables this feature to link the
# shared libLLVM-18.so the distro package provides instead: the
# test-binary links go from minutes to seconds, the binaries from
# ~100MB to a few MB, and the runner no longer has to free disk
# before it can build. Release builds stay static so the shipped
# `hale` has no LLVM runtime dependency.
dynamic-llvm = ["inkwell/llvm18-0-prefer-dynamic"]

[dev-dependencies]
hale-corpus = { path = "../hale-corpus" }
libc = "0.2"
# Test-only: `protox` compiles the generated `.proto` as protoc would, and the
# reflection test holds the served descriptor to what it compiled to
# (api_grpc_proto.rs). Nothing here is the runtime's or the stdlib's.
prost = "0.13"
prost-types = "0.13"
protox = "0.7"
# The hub tests hold a served description to the fixture documents as values.
serde_json = "1"

# Each `tests/<name>.rs` below is one binary; the files an area root pulls in
# with `#[path]` are its modules.
