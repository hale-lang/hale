syntax = "proto3";

service Todo {
  // rpc Todos::add
  // requires editor
  // handler error: status 9, a detail of type type.hale.dev/TodoError
  rpc Todos__add(AddTodo) returns (TodoItem);

  // rpc Todos::complete
  // requires editor
  // handler error: status 9, a detail of type type.hale.dev/TodoError
