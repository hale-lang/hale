[package]
name = "hale-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Hale language CLI"
# Test targets are listed below, not discovered (see `every_test_file_is_built`).
autotests = false

[[bin]]
name = "hale"
path = "src/main.rs"

[dependencies]
hale-model = { path = "../hale-model" }
hale-graph = { path = "../hale-graph" }
hale-syntax = { path = "../hale-syntax" }
hale-types = { path = "../hale-types" }
hale-codegen = { path = "../hale-codegen" }
hale-frontend = { path = "../hale-frontend" }
hale-lsp = { path = "../hale-lsp" }
hale-iris = { path = "../hale-iris" }
hale-dna = { path = "../hale-dna" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# GH #408 Phase 7: ES256 fleet signatures. System OpenSSL on
# purpose — it is already an inherent build/runtime dependency
# (codegen links every native build against -lssl -lcrypto, and
# lotus_tls.c implements std::crypto's ES256 with it), so this
# adds no second crypto provider to the system.
openssl = "0.10"
libc = "0.2"

[features]
# Passthrough to hale-codegen's feature of the same name (link the
# shared libLLVM). Cargo accepts `pkg/feature` only for a selected
# package, and CI's cli/dna jobs select hale-cli, not hale-codegen.
dynamic-llvm = ["hale-codegen/dynamic-llvm"]

# Each `tests/<name>.rs` below is one binary; the files an area root pulls in
# with `#[path]` are its modules.
[[test]]
name = "check_cli"
path = "tests/check_cli.rs"

[[test]]
name = "seeds_build_out_of_tree"
path = "tests/seeds_build_out_of_tree.rs"

[[test]]
name = "dna_fixture_ports_are_free"
path = "tests/dna_fixture_ports_are_free.rs"

[[test]]
name = "dna_native_suite"
path = "tests/dna_native_suite.rs"

[[test]]
name = "dna_orgs"
path = "tests/dna_orgs.rs"

[[test]]
name = "dna_projects"
path = "tests/dna_projects.rs"

[[test]]
name = "dna_records"
path = "tests/dna_records.rs"

[[test]]
name = "effects_baseline_gate"
path = "tests/effects_baseline_gate.rs"

[[test]]
name = "env_knobs_are_documented"
path = "tests/env_knobs_are_documented.rs"

[[test]]
name = "every_test_file_is_built"
path = "tests/every_test_file_is_built.rs"

[[test]]
name = "fleet"
path = "tests/fleet.rs"

[[test]]
name = "hale_native_suite"
path = "tests/hale_native_suite.rs"

[[test]]
name = "imports"
path = "tests/imports.rs"

[[test]]
name = "language_diags"
path = "tests/language_diags.rs"

[[test]]
name = "mcp"
path = "tests/mcp.rs"

[[test]]
name = "model_claims"
path = "tests/model_claims.rs"

[[test]]
name = "three_hop_import"
path = "tests/three_hop_import.rs"

[[test]]
name = "tooling_build"
path = "tests/tooling_build.rs"

[[test]]
name = "tooling_services"
path = "tests/tooling_services.rs"

[[test]]
name = "topology"
path = "tests/topology.rs"

[[test]]
name = "xseed"
path = "tests/xseed.rs"

[build-dependencies]
# The identity list and walk (F.40 phase 0 step 0.4); dependency-free.
hale-graph = { path = "../hale-graph" }
