normative = false

[spec."design-rationale.md"]
tier = "stable"
normative = false

[spec."glossary.md"]
tier = "stable"
normative = false

# ---------------------------------------------------------------------
# The graph registry's Reserved families (spec/registry.md): named,
# with no producer and no syntax. Each is experimental until it ships;
# the test holds this list equal to the registry's Reserved rows.
# ---------------------------------------------------------------------
[registry]
experimental_families = ["runs_under", "transitions", "view"]
