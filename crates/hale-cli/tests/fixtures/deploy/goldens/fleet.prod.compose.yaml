# Rendered by `hale deploy render` from fleet.plan.json: a pure function of the checked program.
# environment: prod
# Build each program first (`hale build <seed>`); a service runs its built binary from
# the mount, in a glibc image compatible with the build host.
services:
  bare-0:
    image: debian:stable-slim
    working_dir: /app
    volumes:
      - ".:/app:ro"
    command: ["/app/bare/bare"]
    environment:
      LOG_LEVEL: "info"
      REGION: "eu"
    depends_on:
      svc-0:
        condition: service_healthy
      svc-1:
        condition: service_healthy
  svc-0:
    image: debian:stable-slim
    working_dir: /app
    volumes:
      - ".:/app:ro"
    command: ["/app/svc/svc"]
    environment:
      LOG_LEVEL: "info"
      REGION: "eu"
    ports:
      - "9100"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 2s
      retries: 30
  svc-1:
    image: debian:stable-slim
    working_dir: /app
    volumes:
      - ".:/app:ro"
    command: ["/app/svc/svc"]
    environment:
      LOG_LEVEL: "info"
      REGION: "eu"
    ports:
      - "9100"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 2s
      timeout: 2s
      retries: 30
