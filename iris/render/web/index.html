<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>iris — live fused view</title>
<style>
  :root { --bg: #0b0e14; --fg: #a8b3c4; --dim: #5c6773; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.45 ui-monospace, "SF Mono", monospace; overflow: hidden; }
  #c { display: block; width: 100vw; height: 100vh; }
  .panel { position: fixed; padding: 10px 14px; background: rgba(11,14,20,.82);
           border: 1px solid #1c2430; border-radius: 8px; backdrop-filter: blur(4px); }
  #hud { top: 12px; left: 14px; }
  #hud b { color: #e6edf3; font-weight: 600; }
  #topics { top: 12px; right: 14px; text-align: right; }
  #law { top: 86px; left: 14px; max-width: 34em; display: none; }
  #law .hdr { color: #e6edf3; margin-bottom: 6px; }
  #law .claim { cursor: pointer; padding: 3px 4px; border-radius: 5px; }
  #law .claim:hover { background: rgba(255,255,255,.05); }
  #law .claim.sel { background: rgba(120,140,170,.12); }
  #law .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
              margin-right: 6px; vertical-align: baseline; }
  #law .dot.hollow { background: transparent !important; border: 1.5px solid; }
  #law .st { color: #8b949e; }
  #law .detail { color: #8b949e; margin: 2px 0 4px 18px; white-space: normal; }
  #law .warn { color: #d29922; }
  #diff { top: 12px; right: 14px; max-width: 44em; max-height: 82vh; overflow-y: auto; display: none; }
  #diff .hdr { color: #e6edf3; margin-bottom: 6px; }
  #diff .sec { color: #8b949e; margin-top: 6px; }
  #diff .row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  #diff .add { color: #7ee787; } #diff .del { color: #f85149; }
  #diff .chg { color: #d29922; } #diff .ren { color: #79c0ff; } #diff .amb { color: #ff7b72; }
  #diff .mv { color: #8b949e; }
  #diff .site { color: #3a4250; }
  #diff .stale { color: #d29922; } #diff .cur { color: #7ee787; } #diff .other { color: #8b949e; }
  #diff .warn { color: #d29922; }
  #organism { top: 12px; right: 14px; max-width: 46em; max-height: 82vh; overflow-y: auto; display: none; }
  #organism .hdr { color: #e6edf3; margin-bottom: 6px; }
  #organism .sec { color: #8b949e; margin-top: 6px; }
  #organism .row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
  #organism .ok { color: #7ee787; } #organism .pend { color: #d29922; } #organism .bad { color: #f85149; }
  #organism .dim { color: #3a4250; }
  #membrane { bottom: 12px; right: 14px; max-width: 30em; display: none; }
  #membrane .hdr { color: #e6edf3; margin-bottom: 6px; }
  #membrane .st { color: #8b949e; }
  #membrane input, #membrane select { background: #0d1117; color: #c9d4e3; border: 1px solid #263041;
           border-radius: 4px; padding: 2px 5px; font: inherit; margin: 1px 0; width: 100%; }
  #membrane button { background: #1c2430; color: #e6edf3; border: 1px solid #2c3a4a; border-radius: 4px;
           padding: 2px 9px; font: inherit; cursor: pointer; margin-top: 3px; }
  #membrane button:hover { background: #263041; }
  #membrane .log { color: #7ee787; margin-top: 4px; white-space: normal; }
  #membrane .err { color: #f85149; }
  #events { bottom: 12px; left: 14px; max-width: 46em; color: var(--dim); }
  #events div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .live { color: #7ee787; } .dead { color: #f85149; }
  #topics { max-height: 60vh; overflow-y: auto; }
  #topics .trow { cursor: default; padding: 0 2px; border-radius: 3px; }
  #topics .trow:hover { background: rgba(120,140,170,.12); }
  #topics .trow.pinned { background: rgba(120,180,255,.16); }
  #topics .z { color: #3a4250; }
  #tip { position: fixed; display: none; pointer-events: none; z-index: 10;
         background: rgba(13,17,23,.94); border: 1px solid #263041;
         border-radius: 8px; padding: 8px 11px; font-size: 11px;
         line-height: 1.5; color: #c9d4e3; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #tip b { color: #e6edf3; }
  #hint { position: fixed; bottom: 12px; right: 14px; color: #3a4250; font-size: 10px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="panel">iris · <span id="conn" class="dead">connecting…</span><br><span id="stats"></span></div>
<div id="topics" class="panel"></div>
<div id="law" class="panel"></div>
<div id="diff" class="panel"></div>
<div id="membrane" class="panel"></div>
<div id="organism" class="panel"></div>
<div id="events" class="panel"></div>
<div id="tip"></div>
<div id="hint">drag pan · wheel zoom · dblclick reset · click flower to pin · h plumbing · c color: topic/latency · l law · 4 review diff · 5 organism · m membrane</div>
<script src="app.js"></script>
</body>
</html>
